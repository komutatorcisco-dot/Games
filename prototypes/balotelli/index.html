<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Выход из пака</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root { --gold: #ffcf3a; --ink: #05040b; --sat: env(safe-area-inset-top, 0px); }
  html, body { margin: 0; height: 100%; background: var(--ink); color: #fff; font-family: Rubik, system-ui, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---- этапы раскрытия: нация, позиция, клуб ---- */
  .beat { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: clamp(14px, 4vw, 22px); opacity: 0; pointer-events: none; text-align: center; z-index: 5; width: min(96vw, 560px); --p: 0; }
  /* свет за элементом: мягкое пятно цвета редкости и горизонтальная вспышка-«анаморф», как у трансляций */
  .bfx { position: absolute; left: 50%; top: 42%; width: 150vw; height: 70vw; max-height: 520px; transform: translate(-50%, -50%); z-index: -1; pointer-events: none;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--c1, #ffcf3a) 45%, transparent), transparent 70%); }
  .bfx::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1.5px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.9) 35%, #fff 50%, rgba(255,255,255,.9) 65%, transparent);
    box-shadow: 0 0 18px 4px color-mix(in srgb, var(--c1, #ffcf3a) 70%, transparent); transform: scaleX(calc(.2 + 1.2 * var(--p))); opacity: calc(1 - var(--p) * .7); }
  /* подпись: тонкие линии по бокам, широкая разрядка */
  .bname { display: flex; align-items: center; gap: 12px; width: 100%; justify-content: center; }
  .bname i { flex: 0 1 60px; height: 2px; background: linear-gradient(90deg, transparent, var(--c1, #ffcf3a)); }
  .bname i:last-child { transform: scaleX(-1); }
  .bname b { font: 800 clamp(16px, 4.8vw, 24px)/1.15 Rubik; letter-spacing: .14em; text-transform: uppercase; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.8); max-width: 78%; }
  /* нация: флаг-ткань в лёгкой перспективе */
  .bflag3 { position: relative; display: flex; width: clamp(220px, 74vw, 400px); aspect-ratio: 3 / 2; transform: perspective(700px) rotateY(-14deg) rotateX(4deg); filter: drop-shadow(0 18px 30px rgba(0,0,0,.6)); }
  .bflag3 i { flex: 1; height: 100%; margin-right: -1px; animation: wave 1.8s ease-in-out infinite; animation-delay: calc(var(--k) * -.07s); }
  @keyframes wave { 0%, 100% { transform: translateY(-2.2%); } 50% { transform: translateY(2.2%); } }
  /* складки ткани: светлые и тёмные полосы плавно бегут по всему флагу */
  .bflag3::after { content: ''; position: absolute; inset: -3% 0; pointer-events: none; mix-blend-mode: soft-light;
    background: repeating-linear-gradient(90deg, rgba(0,0,0,.55) 0%, rgba(255,255,255,.6) 16%, rgba(0,0,0,.55) 33.3%); background-size: 150% 100%; animation: folds 1.8s linear infinite; }
  @keyframes folds { from { background-position: 0 0; } to { background-position: -150% 0; } }
  /* позиция: крупные металлические буквы, по ним проходит блик; за ними — контур-эхо */
  .bpos { position: relative; font: 900 clamp(96px, 30vw, 170px)/.9 Rubik; letter-spacing: .02em; color: transparent;
    background: linear-gradient(100deg, #b98a2e 0%, #fff4c8 calc(var(--p) * 140% - 30%), #fff calc(var(--p) * 140% - 22%), #f6cf63 calc(var(--p) * 140% - 12%), #a8781e 100%); -webkit-background-clip: text; background-clip: text;
    filter: drop-shadow(0 6px 0 rgba(0,0,0,.45)) drop-shadow(0 0 26px color-mix(in srgb, var(--c1, #ffcf3a) 55%, transparent)); }
  .bpos::before { content: attr(data-t); position: absolute; inset: 0; z-index: -1; color: transparent; -webkit-text-stroke: 2px color-mix(in srgb, var(--c1, #ffcf3a) 60%, transparent); transform: scale(calc(1.15 + .25 * var(--p))); opacity: calc(.55 - .5 * var(--p)); }
  /* клуб/серия: эмблема разворачивается к зрителю, за ней лучи */
  .bcrest3 { position: relative; width: clamp(150px, 46vw, 230px); aspect-ratio: 1; display: grid; place-items: center; }
  .bcrest3::before { content: ''; position: absolute; inset: -30%; border-radius: 50%; z-index: -1; opacity: .55;
    background: repeating-conic-gradient(from calc(var(--p) * 60deg), color-mix(in srgb, var(--c1, #ffcf3a) 70%, #fff) 0 4deg, transparent 4deg 16deg);
    -webkit-mask: radial-gradient(closest-side, #000 20%, transparent 75%); mask: radial-gradient(closest-side, #000 20%, transparent 75%); }
  .bcrest3 img { width: 100%; height: 100%; object-fit: contain; transform: perspective(600px) rotateY(calc((1 - min(1, var(--p) * 2.4)) * 70deg)); filter: drop-shadow(0 12px 26px rgba(0,0,0,.65)); }
  /* ---- карточка Jackson ---- */
  /* положение, размер и прозрачность карточки задаёт walkout.js по времени сцены (перемотка и пропуск точны) */
  .jc { --w: 280px; position: fixed; z-index: 4; width: var(--w); aspect-ratio: .72; left: 50%; top: 52%; transform: translate(-50%, -50%); border-radius: calc(var(--w) * .09); opacity: 0; }
  .jc-in { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; background: #0d0a1c; box-shadow: 0 0 0 2px rgba(255,255,255,.08), 0 30px 70px rgba(0,0,0,.6); }
  /* силуэт: тёмная карточка, свет редкости нарастает по краю (--charge 0→1) */
  .jc::before { content: ''; position: absolute; inset: calc(-14px - 22px * var(--charge, 0)); border-radius: inherit; z-index: -1; filter: blur(calc(14px + 18px * var(--charge, 0)));
    background: conic-gradient(from 0deg, var(--c1), var(--c2), var(--c3), var(--c1)); opacity: calc(.15 + .75 * var(--charge, 0)); animation: spin 6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .jc-face { position: absolute; inset: 0; opacity: 0; }
  .jc-bg { position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% 10%, color-mix(in srgb, var(--c1) 55%, #fff 0%), transparent 60%), linear-gradient(160deg, var(--c2), #120d26 70%); opacity: .9; }
  .jc.forgotten .jc-bg { background: radial-gradient(55% 45% at 50% 28%, rgba(255,122,217,.55), transparent 70%), radial-gradient(60% 50% at 85% 0%, rgba(111,184,255,.45), transparent 70%), linear-gradient(165deg, #6a2fd6, #34207f 45%, #13235e); }
  .jc.forgotten .jc-in { box-shadow: inset 0 0 0 3px #f6cf63, 0 30px 70px rgba(0,0,0,.6); }
  .jc.forgotten .jc-r { color: #f6cf63; text-shadow: 0 2px 0 rgba(40,10,60,.8); }
  .jc.forgotten .jc-band { border-top: 2px solid #f6cf63; }
  .jc.forgotten .jc-rar { color: #f6cf63; }
  body.embed .meta, body.embed .bar { display: none; }
  .jc.legend .jc-bg { background: radial-gradient(110% 70% at 50% 8%, rgba(255,255,255,.35), transparent 60%), linear-gradient(135deg, #ff9ae2, #ffe27a 30%, #8ff0d8 55%, #9fdcff 75%, #d6b2ff); }
  .jc-holo { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.45) 45%, transparent 60%); background-size: 250% 100%; animation: holo 3.2s ease-in-out infinite; mix-blend-mode: overlay; }
  @keyframes holo { 0% { background-position: 120% 0 } 100% { background-position: -120% 0 } }
  .jc-ph { position: absolute; left: 22%; right: 0; top: 4%; height: 68%; background: center bottom / contain no-repeat; filter: drop-shadow(0 8px 14px rgba(0,0,0,.45)); }
  .jc-r { position: absolute; left: 9%; top: 8%; display: grid; justify-items: center; line-height: .9; color: #160f2c; }
  .jc-r b { font: 900 calc(var(--w) * .16)/1 Rubik; letter-spacing: -.03em; }
  .jc-r small { font: 800 calc(var(--w) * .07)/1 Rubik; letter-spacing: .06em; margin-top: 4px; }
  .jc-flag { display: block; width: calc(var(--w) * .13); aspect-ratio: 3/2; margin-top: calc(var(--w) * .035); border-radius: 3px; box-shadow: 0 0 0 1.5px rgba(0,0,0,.25); }
  .jc-crest { margin-top: calc(var(--w) * .03); width: calc(var(--w) * .13); height: calc(var(--w) * .13); display: grid; place-items: center; }
  .jc-crest img { width: 100%; height: 100%; object-fit: contain; }
  .jc-band { position: absolute; left: 0; right: 0; bottom: 0; height: 28%; display: grid; align-content: center; justify-items: center; gap: 4px; background: linear-gradient(180deg, rgba(10,6,24,.0), rgba(10,6,24,.92) 35%); }
  .jc-name { font: 900 calc(var(--w) * .1)/1 Rubik; letter-spacing: .04em; }
  .jc-rar { font: 800 calc(var(--w) * .045)/1 Rubik; letter-spacing: .3em; color: var(--c1); }
  .jc.legend .jc-rar { background: linear-gradient(90deg, #ff9ae2, #ffe27a, #8ff0d8, #9fdcff, #d6b2ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .jc-test { position: absolute; top: 4%; right: -30%; transform: rotate(35deg); width: 100%; text-align: center; background: #ff3b5c; color: #fff; font: 900 calc(var(--w) * .045)/1 Rubik; letter-spacing: .2em; padding: 5px 0; display: none; }
  .jc.test .jc-test { display: block; }
  #flash { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 50%, #fff, color-mix(in srgb, var(--c1, #fff) 70%, transparent) 40%, transparent 75%); }

  /* ---- кнопки ---- */
  .bar { position: fixed; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 6; display: flex; justify-content: center; gap: 10px; padding: 0 16px; }
  .bar button { min-width: 120px; padding: 13px 22px; border: 0; border-radius: 999px; font: 800 15px Rubik; color: #fff; background: rgba(255,255,255,.13); backdrop-filter: blur(6px); }
  #cont { background: var(--gold); color: #1d1400; }
  body[data-ui="play"] #cont, body[data-ui="play"] #replay { display: none; }
  body[data-ui="end"] #skip { display: none; }
  .meta { position: fixed; left: 10px; top: max(8px, env(safe-area-inset-top)); z-index: 6; font: 600 10px/1.35 Rubik; color: rgba(255,255,255,.34); max-width: 52vw; }
  #loading { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 6; font: 700 12px Rubik; color: rgba(255,255,255,.6); }
  #toast { position: fixed; left: 50%; top: 18px; transform: translate(-50%, -40px); z-index: 7; max-width: 86vw; padding: 10px 14px; border-radius: 12px; background: rgba(20,16,40,.92); font: 600 13px Rubik; opacity: 0; transition: .3s; text-align: center; }
  #fpsbox { position: fixed; left: 8px; right: 8px; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 56px); z-index: 7; font: 700 11px/1.3 ui-monospace, monospace; color: #9ff0c0; background: rgba(0,0,0,.6); padding: 6px 8px; border-radius: 8px; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .jc::before, .jc-holo { animation: none; } }
</style>
<script src="../../js/data/cards.js"></script>
<script src="../../js/media.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body data-ui="play">
<canvas id="c"></canvas>
<div id="beat" class="beat"></div>
<div id="card" class="jc" data-st="off"><div class="jc-in">
  <div class="jc-face"><div class="jc-bg"></div><div class="jc-holo"></div><div class="jc-ph"></div>
    <div class="jc-r"><b>??</b><small>—</small><i class="jc-flag"></i><span class="jc-crest"></span></div>
    <div class="jc-band"><span class="jc-name"></span><span class="jc-rar"></span></div><div class="jc-test">ТЕСТ</div></div>
</div></div>
<div id="flash"></div>
<div class="bar"><button id="skip">Пропустить</button><button id="replay">Повторить</button><button id="cont">Продолжить</button></div>
<div id="loading" hidden>Загружаем 3D…</div>
<div id="toast"></div>
<div id="fpsbox" hidden></div>
<div class="meta"><span id="src"></span><br><span id="stat">3D грузится…</span> · демо: награды не начисляются</div>
<script type="module" src="./walkout.js?v=20261013-fc1"></script>
</body>
</html>
