<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Выход игрока</title>
<style>
  :root { --gold: #ffcf3a; }
  html, body { margin: 0; height: 100%; background: #07060f; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ui { position: fixed; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; padding: 0 16px; }
  .top { top: max(14px, env(safe-area-inset-top)); flex-direction: column; align-items: center; gap: 2px; pointer-events: none; }
  .top b { font: 900 clamp(26px, 7vw, 44px)/1 system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; opacity: 0; transform: translateY(8px); transition: opacity .5s, transform .5s; }
  .top small { color: var(--gold); font-weight: 800; letter-spacing: .2em; font-size: 12px; opacity: 0; transition: opacity .5s .1s; }
  body.done .top b, body.done .top small { opacity: 1; transform: none; }
  .bottom { bottom: max(18px, env(safe-area-inset-bottom)); }
  button { padding: 12px 22px; border: 0; border-radius: 999px; background: rgba(255,255,255,.12); color: #fff; font: 800 15px system-ui, sans-serif; }
  #replay { background: var(--gold); color: #1d1400; display: none; }
  body.done #replay { display: block; }
  body.done #skip { display: none; }
  #status { position: fixed; left: 8px; bottom: 4px; font-size: 10px; color: rgba(255,255,255,.35); }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui top"><small>ЛЕГЕНДА · 88</small><b>Балотелли</b></div>
<div class="ui bottom"><button id="skip">Пропустить</button><button id="replay">Повторить</button></div>
<div id="status">загрузка…</div>
<script type="module" src="./walkout.js"></script>
</body>
</html>
