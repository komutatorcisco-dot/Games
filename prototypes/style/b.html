<!doctype html>
<!-- Макет стиля Б (22.11): «альбом наклеек» — кремовая бумага, наклейки игроков с белой каймой и тенью, ретро-красный
     и тёмно-синий, жирный шрифт как на старых футбольных альбомах, полутоновые точки. Только для выбора стиля. -->
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,600;0,800;0,900;1,900&family=Oswald:wght@600;700&display=swap">
<style>
:root { --p: #f3ead6; --r: #e0362b; --n: #13234a; --y: #ffcb2e; --ink: #1b1b1b; }
* { box-sizing: border-box; margin: 0; }
body { width: 100vw; height: 100vh; overflow: hidden; color: var(--ink); font-family: Rubik, sans-serif; display: grid; grid-template-rows: 46px 1fr 54px;
  background: radial-gradient(circle, rgba(0,0,0,.07) 1px, transparent 1.3px) 0 0 / 7px 7px, var(--p); }
.top { display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--n); color: #fff; }
.top b { font: 900 16px/1 Rubik; text-transform: uppercase; } .top .ava { width: 30px; height: 30px; border-radius: 50%; background: var(--y); border: 2px solid #fff; }
.cur { margin-left: auto; display: flex; gap: 8px; } .cur span { padding: 5px 10px; border-radius: 20px; background: #fff; color: var(--ink); font: 800 13px/1 Rubik; box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.main { display: grid; grid-template-columns: 1.1fr .9fr 270px; gap: 16px; padding: 12px 18px; min-height: 0; align-items: center; }
.ttl small { display: inline-block; padding: 4px 10px; background: var(--r); color: #fff; font: 700 13px/1 Oswald; letter-spacing: .08em; text-transform: uppercase; transform: rotate(-2deg); }
.ttl h1 { margin-top: 8px; font: italic 900 64px/.9 Rubik; text-transform: uppercase; color: var(--n); text-shadow: 3px 3px 0 var(--y); }
.ttl p { margin: 10px 0 14px; font: 600 14px/1.3 Rubik; color: #4a4030; }
.bar { height: 14px; border: 2.5px solid var(--n); border-radius: 8px; background: #fff; overflow: hidden; width: 260px; } .bar i { display: block; height: 100%; width: 30%; background: var(--r); }
.play { margin-top: 16px; height: 60px; padding: 0 34px; border: 3px solid var(--n); border-radius: 14px; background: var(--y); color: var(--n); font: 900 28px/1 Rubik; text-transform: uppercase; box-shadow: 0 6px 0 var(--n); }
.stk { position: relative; justify-self: center; width: 170px; padding: 8px 8px 0; background: #fff; border-radius: 6px; box-shadow: 0 1px 0 rgba(0,0,0,.2), 4px 8px 14px rgba(0,0,0,.25); transform: rotate(4deg); }
.stk .ph { height: 160px; background: linear-gradient(180deg, #7fb2ff, #2b5fc4); display: grid; place-items: end center; overflow: hidden; } .stk .ph img { width: 150px; }
.stk b { display: block; padding: 8px 4px; font: 900 18px/1 Rubik; text-transform: uppercase; text-align: center; color: var(--n); }
.stk em { position: absolute; top: 14px; left: 14px; padding: 4px 7px; background: var(--r); color: #fff; font: 900 22px/1 Rubik; font-style: normal; border: 2px solid #fff; }
.stk::after { content: 'ЗВЕЗДА КОМАНДЫ'; position: absolute; left: -12px; bottom: -14px; padding: 5px 10px; background: var(--n); color: #fff; font: 700 11px/1 Oswald; letter-spacing: .08em; transform: rotate(-5deg); }
.side { display: grid; gap: 12px; }
.t { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 10px; padding: 10px 12px; border: 2.5px solid var(--n); border-radius: 12px; background: #fff; box-shadow: 0 4px 0 var(--n); }
.t img { width: 52px; height: 52px; object-fit: contain; } .t small { display: block; font: 700 11px/1 Oswald; letter-spacing: .08em; text-transform: uppercase; color: var(--r); }
.t b { font: 900 19px/1.05 Rubik; text-transform: uppercase; color: var(--n); }
.t .pl { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: var(--y); border: 2.5px solid var(--n); font: 900 22px/1 Rubik; color: var(--n); }
nav { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--n); }
nav b { display: grid; place-items: center; color: #c9d3ea; font: 800 13px/1 Rubik; text-transform: uppercase; }
nav b.on { background: var(--y); color: var(--n); border-radius: 12px 12px 0 0; margin-top: -6px; }
</style></head><body>
<div class="top"><span class="ava"></span><b>jedayhagrid1</b><div class="cur"><span>🟢 13 627</span><span>🪙 59 225</span><span>🏆 3 032</span></div></div>
<div class="main">
  <div class="ttl"><small>Дивизионы · 3 на 3</small><h1>Дивизион<br>10</h1><p>30 из 100 очков до 9-го дивизиона</p><div class="bar"><i></i></div><button class="play">▶ Играть</button></div>
  <div class="stk"><em>84</em><div class="ph"><img src="../../img/fcm/player-stand.webp" alt=""></div><b>Джексон</b></div>
  <div class="side">
    <div class="t"><img src="../../img/packs/pk0-160.webp?v=b3" alt=""><span><small>Мяч-дроп · 1</small><b>Открыть</b></span></div>
    <div class="t"><span class="pl">8</span><span><small>Лига канала</small><b>Твоё место</b></span></div>
    <div class="t"><img src="../../img/games/ng-wordle.webp" alt=""><span><small>48 игр</small><b>Мини-игры</b></span></div>
  </div>
</div>
<nav><b>Команда</b><b>События</b><b class="on">Главная</b><b>Задания</b><b>Магазин</b></nav>
</body></html>
