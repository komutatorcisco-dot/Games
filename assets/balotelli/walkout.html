<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Jackson · Балотелли</title>
<script type="module" src="./model-viewer.min.js"></script>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#fff;background:#06090f}*{box-sizing:border-box}body{margin:0;overflow:hidden}button{font:inherit;cursor:pointer}button:disabled{cursor:wait;opacity:.6}.stage{height:100svh;min-height:0;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 66%,#24487366,transparent 49%),linear-gradient(#06090f,#0a1424 70%,#06090f)}.brand{position:absolute;left:clamp(22px,5vw,64px);top:28px;z-index:4;font-size:12px;font-weight:800;letter-spacing:.22em}.brand small{display:block;color:#79869b;font-size:9px;letter-spacing:.19em;margin-top:8px}.skip{position:absolute;right:24px;top:22px;padding:11px 18px;color:#bac6d8;background:#ffffff08;border:1px solid #ffffff20;border-radius:30px;z-index:8}.arena{position:absolute;inset:36% -20% 0;background:repeating-linear-gradient(0deg,transparent 0 35px,#819bb51a 36px 37px,transparent 38px 56px);transform:perspective(500px) rotateX(65deg);opacity:.3}.halo{position:absolute;width:min(65vh,700px);height:min(65vh,700px);border:1px solid #d8bd6738;border-radius:50%;top:48%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 140px #477ecb20,inset 0 0 90px #c5ad5420;opacity:0;transition:opacity 1.4s}.beam{position:absolute;top:-15%;left:50%;height:110%;width:22%;transform-origin:top;background:linear-gradient(#b5d8ff24,#d5e5ff08,transparent);filter:blur(14px);opacity:0;transition:opacity 1s}.b1{transform:rotate(26deg)}.b2{transform:rotate(-26deg) translateX(-100%)}.stage.running .beam,.stage.complete .beam,.stage.running .halo,.stage.complete .halo{opacity:1}.floor{position:absolute;left:50%;top:auto;bottom:205px;width:min(700px,88vw);height:75px;transform:translateX(-50%);background:radial-gradient(ellipse,#99badd30,transparent 65%)}
model-viewer{position:absolute;inset:76px 0 210px;width:100%;height:auto;opacity:0;transform:scale(.93) translateY(26px);transition:opacity 1.1s,transform 2s cubic-bezier(.2,.8,.2,1);--progress-bar-color:transparent;pointer-events:none}.stage.revealed model-viewer,.stage.complete model-viewer{opacity:1;transform:scale(1) translateY(0)}
.pack{position:absolute;left:50%;top:44%;width:205px;height:280px;transform:translate(-50%,-50%) perspective(700px) rotateY(-13deg);border-radius:21px 21px 42px 42px;border:1px solid #dfc270;background:repeating-linear-gradient(135deg,#ffffff04 0 2px,transparent 2px 24px),linear-gradient(145deg,#7d6221,#18223a 43%,#060b14);box-shadow:20px 25px 55px #0008,inset 0 0 40px #d3ab4544;display:grid;place-content:center;text-align:center;transition:transform .7s,opacity .55s;z-index:3}.pack:before{content:'';position:absolute;inset:12px;border:1px solid #c9a54855;border-radius:12px 12px 32px 32px}.pack b{font-size:53px;font-weight:950;letter-spacing:-.06em;color:#e3cc8e}.pack span{font-size:10px;letter-spacing:.3em;margin-top:15px;color:#d8caa7}.stage.running .pack{animation:charge 1.2s ease-in-out both}.stage.revealed .pack,.stage.complete .pack{opacity:0;transform:translate(-50%,-50%) scale(1.7);pointer-events:none}.flash{position:absolute;inset:0;background:#edf4ff;opacity:0;pointer-events:none;z-index:5}.stage.revealed .flash{animation:flash .65s ease-out both}.identity{position:absolute;left:20px;right:20px;bottom:114px;text-align:center;opacity:0;transform:translateY(15px);transition:opacity .8s,transform .8s;pointer-events:none;text-shadow:0 4px 28px #000}.identity .eyebrow{color:#e5c47b;font-size:11px;font-weight:750;letter-spacing:.28em}.identity h1{font-size:clamp(30px,5vw,54px);font-weight:950;letter-spacing:-.035em;line-height:1;margin:13px 0}.identity p{color:#adbdd1;font-size:12px;letter-spacing:.22em;margin:0}.stage.named .identity,.stage.complete .identity{opacity:1;transform:none}.controls{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));left:20px;right:20px;text-align:center;z-index:9}.primary{border:0;padding:16px 36px;border-radius:14px;background:linear-gradient(135deg,#e5cb8e,#bc913d);color:#1b1710;font-weight:850;min-width:210px;box-shadow:0 5px 30px #d7b65c25}.status{display:block;color:#8492a8;font-size:11px;margin:12px auto 0;max-width:440px;line-height:1.5}.tag{position:absolute;top:74px;left:50%;transform:translateX(-50%);color:#adbdcf;font-size:10px;letter-spacing:.28em;white-space:nowrap;opacity:0;transition:opacity .8s}.stage.running .tag,.stage.complete .tag{opacity:1}@keyframes charge{0%,100%{filter:brightness(1)}65%{filter:brightness(2.2);box-shadow:0 0 75px #ead79788}}@keyframes flash{0%{opacity:.9}100%{opacity:0}}@media(max-width:500px){model-viewer{inset:90px 0 210px;height:auto}.identity{bottom:118px}.brand{top:25px}.pack{width:175px;height:250px}.tag{top:90px}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
@media(max-height:600px){model-viewer{inset:55px 0 128px!important;height:auto!important}.identity{bottom:75px}.identity h1{font-size:27px;margin:6px 0}.identity .eyebrow,.identity p{font-size:9px}.controls{bottom:10px}.primary{padding:10px 22px}.status{font-size:9px;margin-top:5px}.tag{display:none}.floor{bottom:120px}.brand{top:15px}.skip{top:10px}.pack{height:190px;width:140px}.pack b{font-size:40px}}
</style></head><body><main class="stage" id="stage"><div class="brand">JACKSON GAMES<small>СТАРИКИ ДЖЕКСОНЫ</small></div><button class="skip" id="skip" hidden>Пропустить →</button><div class="arena"></div><div class="beam b1"></div><div class="beam b2"></div><div class="halo"></div><div class="floor"></div><div class="tag">ВЫХОД ИГРОКА</div>
<model-viewer id="viewer" src="./balotelli-imported-motion.glb" camera-orbit="0deg 90deg 3.6m" camera-target="0m 0.97m 0m" field-of-view="45deg" shadow-intensity=".8" shadow-softness=".8" exposure="1.1" interaction-prompt="none" loading="eager" alt="Марио Балотелли в форме"></model-viewer>
<div class="pack"><b>ДЖ</b><span>JACKSON GAMES</span></div><div class="flash"></div><div class="identity"><div class="eyebrow">ИТАЛИЯ · НАПАДАЮЩИЙ</div><h1>БАЛОТЕЛЛИ</h1><p>МАРИО</p></div><div class="controls"><button class="primary" id="start" disabled>Загрузка модели…</button><small class="status" id="status" role="status">Локальная демонстрация. Игровые награды не начисляются.</small></div></main>
<script>
const v=document.querySelector('#viewer'),stage=document.querySelector('#stage'),start=document.querySelector('#start'),skip=document.querySelector('#skip'),status=document.querySelector('#status');
let loaded=false,begin=0,active=false,complete=false,raf=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
v.addEventListener('load',()=>{loaded=true;v.pause();v.currentTime=.05;start.disabled=false;start.textContent='Открыть пак';window.walkoutReady=true});
v.addEventListener('error',()=>{start.textContent='Не удалось загрузить';status.textContent='Модель не загрузилась. Перезапусти файл в Chrome или Edge.'});
function finish(){cancelAnimationFrame(raf);active=false;complete=true;stage.className='stage complete';v.pause();v.currentTime=.08;skip.hidden=true;start.hidden=false;start.textContent='Посмотреть ещё раз';status.textContent='Демонстрация · без начисления карточек и списания монет';window.walkoutState='complete'}
function tick(now){if(!active)return;const elapsed=(now-begin)/1000;if(elapsed>=1.15)stage.classList.add('revealed');if(elapsed>=2.4)stage.classList.add('named');if(elapsed>=5.5){finish();return}
// A short, gently oscillating standing segment. This is a reveal, not a new walk cycle.
if(elapsed>=1.15){v.currentTime=.05+.6*(.5-.5*Math.cos((elapsed-1.15)*1.2));}
raf=requestAnimationFrame(tick)}
start.onclick=()=>{if(!loaded)return;cancelAnimationFrame(raf);active=true;complete=false;v.pause();v.currentTime=.05;stage.className='stage running';start.hidden=true;skip.hidden=false;status.textContent='';window.walkoutState='running';begin=performance.now();if(reduced)finish();else raf=requestAnimationFrame(tick)};
skip.onclick=finish;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&active)finish()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&active)finish()});
window.walkoutDiagnostics=()=>({loaded,active,complete,duration:v.duration,clips:v.availableAnimations});
</script></body></html>
