<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Балотелли — проверка анимации</title>
<script type="module" src="./model-viewer.min.js"></script>
<style>body{margin:0;background:#10141d;color:#f3f5fb;font:16px system-ui}main{max-width:900px;margin:auto;padding:20px}h1{font-size:24px;margin:0 0 6px}p{color:#b2bac9}model-viewer{width:100%;height:65vh;min-height:360px;background:radial-gradient(ellipse at bottom,#364560,#151b27);border-radius:20px}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:18px 0}button{border:0;background:#f4cf57;padding:12px 18px;border-radius:12px;font:inherit;cursor:pointer}input{flex:1;min-width:140px}small{color:#aeb9cb}</style>
<main><h1>Балотелли · проверка движения</h1><p>Локальный прототип. Поверни модель мышью или пальцем.</p>
<model-viewer id="viewer" src="./balotelli-imported-motion.glb" camera-controls autoplay shadow-intensity="0.7" exposure="1.15" camera-orbit="0deg 80deg 3.6m" camera-target="0m 0.95m 0m" interaction-prompt="none" alt="Анимированная модель Балотелли"></model-viewer>
<nav><button id="toggle" disabled>Пауза</button><button id="restart" disabled>Сначала</button><input id="timeline" type="range" min="0" max="8.34" step="0.01" value="0" aria-label="Момент анимации"><span id="time">0.0 с</span></nav><small id="status">Загрузка модели…</small></main>
<script>const v=document.querySelector('#viewer'),t=document.querySelector('#timeline'),label=document.querySelector('#time'),status=document.querySelector('#status'),toggle=document.querySelector('#toggle');
v.addEventListener('load',()=>{status.textContent=`Модель загружена · ${v.availableAnimations.length} анимация · ${v.duration.toFixed(2)} с`;t.max=v.duration;toggle.disabled=false;document.querySelector('#restart').disabled=false;window.previewReady=true});
v.addEventListener('error',e=>{status.textContent='Не удалось загрузить модель';window.previewError=String(e.detail?.type)});
toggle.onclick=()=>{if(v.paused){v.play();toggle.textContent='Пауза'}else{v.pause();toggle.textContent='Продолжить'}};
document.querySelector('#restart').onclick=()=>{v.currentTime=0;v.play();toggle.textContent='Пауза'};
t.oninput=()=>{v.pause();v.currentTime=+t.value;toggle.textContent='Продолжить'};
function tick(){if(!v.paused)t.value=v.currentTime;label.textContent=(v.currentTime||0).toFixed(1)+' с';requestAnimationFrame(tick)}tick();</script></html>
