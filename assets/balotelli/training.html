<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'gltf-loader';
import {createMatch,update,shoot,resetBall,field} from 'training-physics';
const status=document.querySelector('#status');
try{
const scene=new THREE.Scene();scene.background=new THREE.Color('#122632');scene.fog=new THREE.Fog('#122632',40,90);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.1,120);camera.position.set(0,19,23);camera.lookAt(0,0,-1);
scene.add(new THREE.HemisphereLight(0xdcecff,0x395124,2.4));const sun=new THREE.DirectionalLight(0xffe6bb,3);sun.position.set(-9,20,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-20,right:20,top:22,bottom:-22});scene.add(sun);

function line(points){const geometry=new THREE.BufferGeometry().setFromPoints(points.map(([x,z])=>new THREE.Vector3(x,.018,z)));scene.add(new THREE.Line(geometry,new THREE.LineBasicMaterial({color:'#d7eddf'})));}
line([[-9.8,-14.8],[9.8,-14.8],[9.8,14.8],[-9.8,14.8],[-9.8,-14.8]]);line([[-9.8,0],[9.8,0]]);line([[-5,-13],[-5,-8],[5,-8],[5,-13]]);line(Array.from({length:65},(_,i)=>[Math.cos(i/64*Math.PI*2)*2.5,Math.sin(i/64*Math.PI*2)*2.5]));
const postMat=new THREE.MeshStandardMaterial({color:'#e8eff0'});function post(a,b){const av=new THREE.Vector3(...a),bv=new THREE.Vector3(...b),d=bv.clone().sub(av);const m=new THREE.Mesh(new THREE.CylinderGeometry(.065,.065,d.length(),10),postMat);m.position.copy(av.add(bv).multiplyScalar(.5));m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());scene.add(m);}
post([-2.7,0,-13],[-2.7,2.5,-13]);post([2.7,0,-13],[2.7,2.5,-13]);post([-2.7,2.5,-13],[2.7,2.5,-13]);for(let x=-2.7;x<=2.7;x+=.3)post([x,0,-14],[x,2.5,-14]);for(let y=0;y<=2.5;y+=.3)post([-2.7,y,-14],[2.7,y,-14]);
const ball=new THREE.Mesh(new THREE.SphereGeometry(.22,20,14),new THREE.MeshStandardMaterial({color:'#f4f1dc',roughness:.8}));ball.castShadow=true;scene.add(ball);const seam=new THREE.Mesh(new THREE.TorusGeometry(.221,.013,5,30),new THREE.MeshStandardMaterial({color:'#283842'}));ball.add(seam);
const keeper=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.3,.75,4,8),new THREE.MeshStandardMaterial({color:'#ff974e'}));body.position.y=.95;body.castShadow=true;keeper.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.2,12,8),new THREE.MeshStandardMaterial({color:'#e3bb95'}));head.position.y=1.7;keeper.add(head);scene.add(keeper);
const actor=new THREE.Group();scene.add(actor);const placeholder=new THREE.Mesh(new THREE.CapsuleGeometry(.27,.8,4,8),new THREE.MeshStandardMaterial({color:'#3999e6'}));placeholder.position.y=.95;actor.add(placeholder);
const bytes=Uint8Array.from(atob(MODEL_BASE64),c=>c.charCodeAt(0));
new GLTFLoader().parse(bytes.buffer,'',gltf=>{actor.remove(placeholder);const root=gltf.scene;root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false;}});actor.add(root);status.textContent='Балотелли загружен · управление и физика — черновой прототип';window.trainingModelReady=true;},error=>{status.textContent='Модель не загрузилась; управление доступно с заменителем';console.error(error)});
const state=createMatch(),keys=new Set(),stick={x:0,z:0};let charge=null;
const shootNow=()=>{shoot(state,charge===null?.5:Math.min(1,(performance.now()-charge)/900));charge=null;};
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();keys.add(e.code);if(e.code==='Space'&&!e.repeat)charge=performance.now();if(e.code==='KeyR')resetBall(state)});
addEventListener('keyup',e=>{keys.delete(e.code);if(e.code==='Space')shootNow()});
const fire=document.querySelector('#shoot');fire.onpointerdown=e=>{fire.setPointerCapture(e.pointerId);charge=performance.now();};fire.onpointerup=shootNow;fire.onpointercancel=()=>charge=null;
document.querySelector('#reset').onclick=()=>resetBall(state);const pad=document.querySelector('#pad'),nub=document.querySelector('#nub');let pointer=null;
function stickMove(e){if(pointer!==e.pointerId)return;const r=pad.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/42,z=(e.clientY-r.top-r.height/2)/42;const n=Math.max(1,Math.hypot(x,z));stick.x=x/n;stick.z=z/n;nub.style.transform=`translate(${stick.x*34}px,${stick.z*34}px)`;}

function clearInput(){keys.clear();stick.x=stick.z=0;charge=null;pointer=null;nub.style.transform='none'}addEventListener('blur',clearInput);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInput()});
let last=performance.now();function frame(now){const dt=Math.min((now-last)/1000,.033);last=now;update(state,{x:stick.x+(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0),z:stick.z+(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-(keys.has('KeyW')||keys.has('ArrowUp')?1:0),sprint:keys.has('ShiftLeft')||keys.has('ShiftRight')},dt);actor.position.set(state.player.x,0,state.player.z);actor.rotation.y=Math.atan2(state.player.dx,state.player.dz);ball.position.set(state.ball.x,state.ball.y,state.ball.z);ball.rotation.x+=state.ball.vz*dt;ball.rotation.z-=state.ball.vx*dt;keeper.position.set(state.keeper.x,0,state.keeper.z);document.querySelector('#goals').textContent=state.goals;document.querySelector('#shots').textContent=state.shots;document.querySelector('#message').textContent=state.scored>0?'ГОЛ!':'';renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.position.set(0,innerWidth<innerHeight?27:19,innerWidth<innerHeight?32:23);camera.lookAt(0,0,-1);camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});dispatchEvent(new Event('resize'));window.trainingState=state;
}catch(error){status.textContent='Не удалось запустить 3D: '+error.message;console.error(error)}
</script></body></html>
