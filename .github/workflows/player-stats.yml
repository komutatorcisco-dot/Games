# Статистика игроков из рабочей базы D1 — только чтение. Итог — в сводке запуска (Summary) и в журнале.
# Только ручной запуск: один прогон читает ~13 млн строк при дневном лимите D1 в 5 млн (16.10 база встала до полуночи UTC).
name: Статистика игроков

on:
  workflow_dispatch:
    inputs:
      days: { description: 'За сколько дней', default: '21' }

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Статистика
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DAYS: ${{ github.event.inputs.days || '21' }}
        run: node tools/player-stats.mjs
