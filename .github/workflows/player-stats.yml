# Статистика игроков из рабочей базы D1 — только чтение. Итог — в сводке запуска (Summary) и в журнале.
name: Статистика игроков

on:
  workflow_dispatch:
    inputs:
      days: { description: 'За сколько дней', default: '21' }
  push:
    branches: ['claude/ui-quality', 'claude/telegram-channel-games-kj1xly']
    paths: ['tools/player-stats.mjs', '.github/workflows/player-stats.yml']

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Статистика
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DAYS: ${{ github.event.inputs.days || '21' }}
        run: node tools/player-stats.mjs
