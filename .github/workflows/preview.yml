# Превью новой версии на своём iPhone внутри Telegram — без влияния на игроков.
# Срабатывает ТОЛЬКО на пуш в ветку preview/* (например preview/redesign). Рабочий сайт (GitHub Pages),
# рабочий сервер jackson-games и его база D1 не затрагиваются:
#   • сайт → Cloudflare Pages, проект «jackson-games-preview» (https://jackson-games-preview.pages.dev);
#   • сервер → проверочный воркер «jackson-games-staging» со своей базой D1 (как в worker-staging.yml);
#   • на этом адресе игра всегда в режиме ?stage=1: ходит только на проверочный сервер, пишет в облако Telegram под ключами pv_*
#     (настоящее сохранение лишь копируется при первом запуске), покупки за Stars отключены.
# Разовая настройка (вручную, один раз):
#   1) Токен CF_API_TOKEN должен иметь право «Cloudflare Pages: Edit» (и «Workers Scripts: Edit», как уже есть).
#   2) @BotFather → /newapp → бот игры → ссылка https://jackson-games-preview.pages.dev/ , короткое имя preview.
#      Появится отдельная ссылка t.me/<бот>/preview; кнопка «Играть» и меню бота у игроков не меняются.
# Тестовый адрес сам включает режим проверочного сервера (js/config.js), а сервер сам пускает этот адрес (PREVIEW_ORIGIN).
name: Превью для iPhone

on:
  push:
    branches: ['preview/**']

concurrency: { group: preview, cancel-in-progress: true }

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Проверить код и тесты
        run: |
          find js server tests -name '*.js' -not -path '*/vendor/*' -print0 | xargs -0 -n1 node --check
          for test in tests/*.test.js; do
            case "$test" in *-browser.test.js) continue ;; esac
            node "$test"
          done
      - name: Сервер превью → jackson-games-staging
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          ACC=$(echo "$CF_ACCOUNT_ID" | tr -d '[:space:]')
          [ -n "$ACC" ] || { echo "::error::Нет секретов Cloudflare"; exit 1; }
          out=$(curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/jackson-games-staging/content" \
            -H "Authorization: Bearer $(echo "$CF_API_TOKEN" | tr -d '[:space:]')" \
            -F 'metadata={"main_module":"worker.js"};type=application/json' \
            -F 'worker.js=@server/worker.js;type=application/javascript+module')
          echo "$out" | head -c 600; echo
          echo "$out" | grep -Eq '"success": *true' || { echo "::error::Воркер jackson-games-staging не принял код — см. worker-staging.yml"; exit 1; }
      - name: Тестовый сервер — адрес workers.dev и подключения
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          ACC=$(echo "$CF_ACCOUNT_ID" | tr -d '[:space:]'); TOK=$(echo "$CF_API_TOKEN" | tr -d '[:space:]')
          API="https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/jackson-games-staging"
          # включить адрес jackson-games-staging.<имя>.workers.dev (без него Cloudflare отвечает «error code: 1042»)
          curl -sS -X POST "$API/subdomain" -H "Authorization: Bearer $TOK" -H 'content-type: application/json' -d '{"enabled":true}' | head -c 300; echo
          # какие подключения есть у тестового сервера: только имена и типы, значения секретов API не отдаёт
          curl -sS "$API/settings" -H "Authorization: Bearer $TOK" | python3 -c "import sys,json; r=json.load(sys.stdin); b=(r.get('result') or {}).get('bindings') or []; print('Подключения:', ', '.join(x.get('name','?')+' ('+x.get('type','?')+')' for x in b) or 'нет', '| ok' if r.get('success') else r.get('errors'))"
      - name: Сайт превью → Cloudflare Pages
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN=$(echo "$CF_API_TOKEN" | tr -d '[:space:]') CLOUDFLARE_ACCOUNT_ID=$(echo "$CF_ACCOUNT_ID" | tr -d '[:space:]')
          mkdir -p site
          cp -r index.html css js img fonts vendor prototypes site/
          npx --yes wrangler@3.114.0 pages project create jackson-games-preview --production-branch main || true
          npx --yes wrangler@3.114.0 pages deploy site --project-name jackson-games-preview --branch main --commit-dirty=true
          echo "Превью: https://jackson-games-preview.pages.dev/ (в Telegram — через ссылку Mini App из @BotFather)"
      - name: Проверить, что тестовая версия отвечает
        run: |
          sleep 15
          code=$(curl -sS -o site.html -w '%{http_code}' https://jackson-games-preview.pages.dev/)
          echo "Сайт: HTTP $code"; [ "$code" = 200 ] && grep -q 'js/config.js' site.html || { echo "::error::Тестовый сайт не открылся"; exit 1; }
          curl -sS https://jackson-games-preview.pages.dev/js/config.js | grep -q 'jackson-games-preview' || { echo "::error::На сайте старая версия config.js"; exit 1; }
          hdr=$(curl -sS -D - -o presence.json -H 'Origin: https://jackson-games-preview.pages.dev' https://jackson-games-staging.komutatorcisco.workers.dev/presence)
          echo "Сервер: $(head -c 200 presence.json)"
          grep -q '"ok":true' presence.json || { echo "::error::Тестовый сервер не отвечает или не подключён к своей базе D1"; exit 1; }
          echo "$hdr" | grep -qi 'access-control-allow-origin: https://jackson-games-preview.pages.dev' || { echo "::error::Тестовый сервер не пускает тестовый сайт (CORS)"; exit 1; }
          health=$(curl -sS https://jackson-games-staging.komutatorcisco.workers.dev/health); echo "Проверка сервера: $health"
          echo "$health" | grep -q '"bot":"' || { echo "::error::Telegram не узнаёт ключ бота BOT_TOKEN на тестовом сервере — вход в тестовую версию не сработает"; exit 1; }
          echo "Тестовая версия работает: сайт открывается, сервер с базой отвечает тестовому сайту"
