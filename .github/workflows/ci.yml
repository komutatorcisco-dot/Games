name: Quality checks

on:
  push:
    branches:
      - 'claude/telegram-channel-games-kj1xly'
      - 'jarvis/**'
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check all JavaScript sources
        run: |
          find js server tests \( -name '*.js' -o -name '*.mjs' \) -not -path '*/vendor/*' -print0 | xargs -0 -n1 node --check
      - name: Verify generated economy catalog
        run: |
          node tools/economy-catalog.mjs
          git diff --exit-code -- server/economy/generated
      - name: Run Node unit and integration tests
        run: |
          for test in tests/*.test.js; do
            case "$test" in *-browser.test.js) continue ;; esac
            echo "=== $test ==="
            node "$test"
          done

  browser-tests:
    if: github.event_name == 'pull_request'
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser QA dependencies
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chrome
      - name: Run phone-size browser regression tests
        run: |
          for test in tests/*-browser.test.js; do
            echo "=== $test ==="
            node "$test"
          done
      - name: Save test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jackson-mobile-browser-qa
          path: tests/*-qa.png
          if-no-files-found: ignore
