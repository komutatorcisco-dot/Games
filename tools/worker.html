<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Код сервера</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 20px 16px 40px; background: #0b0b0f; color: #f5f5f7; font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 6px; } p { margin: 0 0 14px; color: #c8c8d0; }
  button { width: 100%; padding: 16px; border: 0; border-radius: 12px; background: #ffcf3a; color: #16120a; font: 700 18px inherit; }
  button.done { background: #3ee66b; }
  .meta { font-size: 13px; color: #8d8d99; margin: 10px 0 0; text-align: center; }
  textarea { width: 100%; height: 160px; margin-top: 16px; box-sizing: border-box; background: #17171d; color: #8d8d99; border: 1px solid #2a2a33; border-radius: 10px; font: 11px/1.4 ui-monospace, monospace; padding: 10px; }
</style></head><body>
<h1>Код сервера игр</h1>
<p>Нажми кнопку — весь код скопируется. Потом вставь его в Cloudflare вместо старого.</p>
<button id="b" disabled>Загружаю…</button>
<p class="meta" id="m"></p>
<textarea id="t" readonly></textarea>
<script>
  const b = document.getElementById('b'), t = document.getElementById('t'), m = document.getElementById('m');
  fetch('../server/worker.js?t=' + Date.now()).then((r) => r.text()).then((code) => {
    t.value = code; b.disabled = false; b.textContent = 'Скопировать код';
    m.textContent = code.split('\n').length + ' строк';
  }).catch(() => { b.textContent = 'Не загрузилось, обнови страницу'; });
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(t.value); }
    catch (e) { t.focus(); t.select(); t.setSelectionRange(0, t.value.length); document.execCommand('copy'); }
    b.textContent = 'Скопировано ✓'; b.classList.add('done');
  };
</script>
</body></html>
