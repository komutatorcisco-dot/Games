<!doctype html>
<!-- Объёмные значки плиток главной (28.10): выдавленные фигуры с фаской, хром и бирюза, как у паков.
     Запуск: node tools/art/render.js icons → img/fcm/ic-*.webp -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head>
<body><script src="../../vendor/three.min.js"></script><script src="../../js/arena3d.js"></script><script>
'use strict';
const L = (h) => new THREE.Color(h).convertSRGBToLinear();
function rr(s, x, y, w, h, r) { s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); }
function star(cx, cy, R, r) { const s = new THREE.Shape(); for (let i = 0; i < 10; i++) { const a = Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r : R; i ? s.lineTo(cx + q * Math.cos(a), cy + q * Math.sin(a)) : s.moveTo(cx + q * Math.cos(a), cy + q * Math.sin(a)); } return s; }
function circle(cx, cy, r) { const s = new THREE.Shape(); s.absarc(cx, cy, r, 0, Math.PI * 2, false); return s; }
const ext = (shape, d = 0.22, b = 0.07) => new THREE.ExtrudeGeometry(shape, { depth: d, bevelEnabled: true, bevelThickness: b, bevelSize: b * 0.8, bevelSegments: 5, curveSegments: 24 });
let R = null;
function rig(w, h) {
  if (!R) { R = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); R.outputEncoding = THREE.sRGBEncoding; R.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(R.domElement); }
  R.setPixelRatio(1); R.setSize(w, h); R.setClearColor(0, 0);
  const sc = new THREE.Scene();
  const env = new THREE.Scene(); env.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), new THREE.MeshBasicMaterial({ color: 0x0a1424, side: THREE.BackSide })));
  [[-12, 12, 12, 0xffffff, 12, 14], [14, 4, 10, 0x9ff3ff, 8, 14], [0, -14, 8, 0x3fa9ff, 20, 4]].forEach(([x, y, z, c, a, b]) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(a, b), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m); });
  sc.environment = new THREE.PMREMGenerator(R).fromScene(env, 0.02).texture;
  const k = new THREE.DirectionalLight(0xffffff, 1.2); k.position.set(-3, 4, 6); sc.add(k); sc.add(new THREE.AmbientLight(0xffffff, 0.25));
  return sc;
}
const chrome = () => new THREE.MeshStandardMaterial({ color: L('#e8f4ff'), metalness: 0.9, roughness: 0.18 });
const teal = () => new THREE.MeshStandardMaterial({ color: L('#19d3e0'), metalness: 0.55, roughness: 0.25, emissive: L('#0a6a80'), emissiveIntensity: 0.35 });
const gold = () => new THREE.MeshStandardMaterial({ color: L('#ffcf4a'), metalness: 0.85, roughness: 0.22, emissive: L('#5a3a00'), emissiveIntensity: 0.25 });
const ICONS = {
  events(g) { // календарь со звездой
    const body = new THREE.Shape(); rr(body, -1, -1.05, 2, 1.85, 0.28); const hole = new THREE.Path(); rr(hole, -0.78, -0.85, 1.56, 1.2, 0.14); body.holes.push(hole);
    g.add(new THREE.Mesh(ext(body), chrome()));
    const top = new THREE.Shape(); rr(top, -1, 0.45, 2, 0.36, 0.18); const tm = new THREE.Mesh(ext(top, 0.26), teal()); tm.position.z = 0.02; g.add(tm);
    [-0.55, 0.55].forEach((x) => { const r = new THREE.Shape(); rr(r, x - 0.1, 0.62, 0.2, 0.5, 0.1); g.add(new THREE.Mesh(ext(r, 0.3), chrome())); });
    const st = new THREE.Mesh(ext(star(0, -0.25, 0.52, 0.22), 0.25, 0.06), gold()); st.position.z = 0.05; g.add(st);
  },
  daily(g) { // игрок (голова и плечи) со знаком вопроса
    g.add(new THREE.Mesh(ext(circle(-0.25, 0.42, 0.48)), chrome()));
    const b = new THREE.Shape(); b.moveTo(-1.15, -1.05); b.lineTo(0.65, -1.05); b.quadraticCurveTo(0.7, -0.05, -0.25, -0.12); b.quadraticCurveTo(-1.2, -0.05, -1.15, -1.05); g.add(new THREE.Mesh(ext(b), chrome()));
    const q = new THREE.Shape(); q.absarc(0.72, 0.42, 0.36, Math.PI, -0.4, true); q.lineTo(0.78, -0.05); q.lineTo(0.62, -0.05); q.lineTo(0.62, 0.14); q.absarc(0.72, 0.42, 0.2, -0.6, Math.PI, false); q.closePath();
    const qm = new THREE.Mesh(ext(q, 0.25, 0.05), teal()); qm.position.z = 0.1; g.add(qm);
    const dot = new THREE.Mesh(ext(circle(0.7, -0.3, 0.1), 0.25, 0.04), teal()); dot.position.z = 0.1; g.add(dot);
  },
};
// пластина-фон для плиток (как фон карточек): металлическая рамка с фаской, внутри тёмное стекло с выдавленными сотами
const PLATES = { teal: ['#0b2f55', '#3fe6ff', '#bff8ff'], blue: ['#0d2552', '#5aa8ff', '#d6ecff'], green: ['#0a3a2a', '#3effa0', '#d4ffe8'], gold: ['#2a1f08', '#e9c46a', '#fff1c4'] };
window.renderPlate = (kind, w, h) => {
  const [deep, rim, hi] = PLATES[kind]; const sc = rig(w, h), g = new THREE.Group(), W = w / 100, H = h / 100, r = Math.min(W, H) * 0.12;
  const outer = new THREE.Shape(); rr(outer, -W / 2, -H / 2, W, H, r); const inner = new THREE.Path(); const m = Math.min(W, H) * 0.03; rr(inner, -W / 2 + m, -H / 2 + m, W - 2 * m, H - 2 * m, r * 0.7); outer.holes.push(inner);
  g.add(new THREE.Mesh(new THREE.ExtrudeGeometry(outer, { depth: 0.08, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.04, bevelSegments: 6, curveSegments: 16 }), new THREE.MeshStandardMaterial({ color: L(rim), metalness: 0.9, roughness: 0.2, emissive: L(rim), emissiveIntensity: 0.25 })));
  const base = new THREE.Shape(); rr(base, -W / 2 + m, -H / 2 + m, W - 2 * m, H - 2 * m, r * 0.7);
  g.add(new THREE.Mesh(new THREE.ShapeGeometry(base), new THREE.MeshStandardMaterial({ color: L(deep), metalness: 0.6, roughness: 0.35 })));
  // соты
  const hs = Math.min(W, H) * 0.05, hexG = new THREE.ExtrudeGeometry((() => { const s = new THREE.Shape(); for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; i ? s.lineTo(hs * 0.86 * Math.cos(a), hs * 0.86 * Math.sin(a)) : s.moveTo(hs * 0.86 * Math.cos(a), hs * 0.86 * Math.sin(a)); } return s; })(), { depth: 0.012, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 2 });
  const hm = new THREE.MeshStandardMaterial({ color: L(deep).lerp(L(rim), 0.18), metalness: 0.75, roughness: 0.3 });
  for (let y = -H / 2; y < H / 2 + hs; y += hs * 1.5) for (let x = -W / 2 + ((Math.round(y / (hs * 1.5)) % 2) ? hs * 0.866 : 0); x < W / 2 + hs; x += hs * 1.732) {
    if (Math.abs(x) > W / 2 - m - hs * 0.9 || Math.abs(y) > H / 2 - m - hs * 0.9) continue; const q = new THREE.Mesh(hexG, hm); q.position.set(x, y, 0.005); g.add(q); }
  // мягкий свет сверху внутри
  const gc = document.createElement('canvas'); gc.width = gc.height = 256; const gx = gc.getContext('2d'), gr = gx.createRadialGradient(128, 70, 0, 128, 70, 150); gr.addColorStop(0, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); gx.fillStyle = gr; gx.fillRect(0, 0, 256, 256);
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(gc), color: L(hi), transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false })); glow.position.z = 0.05; g.add(glow);
  sc.add(g); const cam = new THREE.OrthographicCamera(-W / 2 * 1.04, W / 2 * 1.04, H / 2 * 1.04, -H / 2 * 1.04, 0.1, 50); cam.position.set(0.15, 0.25, 10); cam.lookAt(0, 0, 0);
  R.render(sc, cam); return R.domElement.toDataURL('image/png');
};
// глянцевый мяч для плашки «Играть»: настоящая модель мяча игры (Arena3D.ball), блики от окружения
window.renderBall = (px) => { const sc = rig(px, px), b = Arena3D.ball('classic', 1);
  b.traverse((o) => { if (o.isMesh) { o.material.color.convertSRGBToLinear(); o.material.roughness = 0.22; o.material.envMapIntensity = 1.3; } });
  b.rotation.set(0.5, 0.9, 0.2); sc.add(b); const cam = new THREE.PerspectiveCamera(26, 1, 0.1, 50); cam.position.set(0, 0, 4.7); cam.lookAt(0, 0, 0); R.render(sc, cam); return R.domElement.toDataURL('image/png'); };
window.renderIcon = (id) => { const sc = rig(256, 256), g = new THREE.Group(); ICONS[id](g); g.rotation.set(-0.12, 0.32, 0.02); sc.add(g);
  const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100); cam.position.set(0, 0, 6.4); cam.lookAt(0, -0.05, 0); R.render(sc, cam); return R.domElement.toDataURL('image/png'); };
</script></body></html>
