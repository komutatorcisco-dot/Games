<!doctype html>
<!-- Генератор картинок режимов нового вида: 3D-игроки (assets3d/player.glb + js/playerkit.js), ворота, мяч, фишки.
     Запуск: node tools/art/render.js modes — сохраняет img/fcm/mode-*.webp (прозрачный фон).
     Посмотреть одну сцену: tools/art/modes.html?view=mom -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head>
<body><script src="../../vendor/three.min.js"></script><script src="../../js/arena3d.js"></script><script src="../../js/playerkit.js"></script><script>
'use strict';
const { goal } = Arena3D.parts;
let R = null;
function rig(w, h) {
  if (!R) { R = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); R.outputEncoding = THREE.sRGBEncoding; R.toneMapping = THREE.ACESFilmicToneMapping; R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap; document.body.appendChild(R.domElement); }
  R.setPixelRatio(1); R.setSize(w, h); R.setClearColor(0, 0);
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xcfd8ff, 0x203048, 0.75));
  const key = new THREE.DirectionalLight(0xfff2dc, 1.25); key.position.set(-6, 10, 8); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 }); scene.add(key);
  const rim = new THREE.DirectionalLight(0x9fd0ff, 0.9); rim.position.set(6, 5, -8); scene.add(rim);
  // тень на прозрачном полу
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.35 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  return scene;
}
const L = (h) => new THREE.Color(h).convertSRGBToLinear(); // цвета в линейном пространстве — иначе блёклые
const std = (h, o = {}) => new THREE.MeshStandardMaterial({ color: L(h), roughness: 0.35, metalness: 0.05, ...o });
function ballM(r = 0.38) { const b = Arena3D.ball('classic', r); b.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.material.color.convertSRGBToLinear(); } }); return b; }
function cone(x, z, s = 1) { const g = new THREE.Group(); const c = new THREE.Mesh(new THREE.ConeGeometry(0.26, 0.62, 32), std('#ff6a00', { roughness: 0.4 })); c.position.y = 0.31; c.castShadow = true; g.add(c);
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.135, 0.175, 0.1, 32), std('#ffffff')); band.position.y = 0.36; g.add(band);
  const base = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.05, 0.62), std('#ff6a00')); base.position.y = 0.025; base.castShadow = true; g.add(base); g.position.set(x, 0, z); g.scale.setScalar(s); return g; }
function goalM(sc) { const gl = goal(1); gl.traverse((o) => { if (o.isMesh && o.material.color) o.material.color.convertSRGBToLinear(); }); gl.scale.setScalar(sc); return gl; }
// 3D-игрок: внешность и поза из PlayerKit; s — масштаб (игроки чуть крупнее мяча и ворот, как на плитке)
let G = null;
const ready = PlayerKit.load('../../').then((g) => (G = g));
const KIT = {
  red: { pattern: 'plain', c1: '#e3243f', c2: '#ffffff', shorts: '#ffffff', socks: '#e3243f' },
  redS: { pattern: 'stripes', c1: '#e3243f', c2: '#ffffff', shorts: '#111111', socks: '#e3243f' },
  blue: { pattern: 'plain', c1: '#1f5bd8', c2: '#ffffff', shorts: '#ffffff', socks: '#1f5bd8' },
  navy: { pattern: 'sleeves', c1: '#11204f', c2: '#c6ff3d', shorts: '#11204f', socks: '#c6ff3d' },
};
let NOMEN = false; // плашки без игроков
function man(kit, look, pose, x, z, ry, s = 1) {
  if (NOMEN) return new THREE.Group();
  const p = PlayerKit.make(G, PlayerKit.kit(Object.assign({}, KIT[kit], look)), pose);
  p.scale.multiplyScalar(s); p.position.set(x, 0, z); p.rotation.y = ry;
  p.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.frustumCulled = false; } });
  return p;
}
const SCENES = {
  dribble(s) { [[-1.8, 0], [-0.6, 0], [0.6, 0], [1.8, 0]].forEach(([x, z]) => s.add(cone(x, z, 0.8)));
    // линия слалома: светящаяся лента змейкой между фишками
    const pts = []; for (let i = 0; i <= 60; i++) { const x = -2.4 + i * 0.08; pts.push(new THREE.Vector3(x, 0.03, Math.sin((x + 2.4) * Math.PI / 1.2) * 0.55)); }
    const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 120, 0.04, 8), new THREE.MeshBasicMaterial({ color: L('#ffd23c') })); s.add(tube);
    s.add(man('blue', { number: 7, skin: 4, style: 'afro' }, 'run2', 0.9, 0.5, Math.PI / 2 - 0.5, 1.15));
    const b = ballM(0.2); b.position.set(1.55, 0.2, 0.55); b.rotation.set(0.3, 0.6, 0); s.add(b);
    return { pos: [-0.4, 2.8, 5.2], look: [0.3, 0.6, 0], fov: 38 }; },
  targets(s) { const gl = goalM(0.62); gl.position.set(0, 0, -1.4); gl.rotation.y = Math.PI / 2; s.add(gl);
    // мишени-кольца в углах ворот
    [[-1.65, 1.15], [1.65, 1.15], [-1.65, 0.45]].forEach(([x, y]) => { const g = new THREE.Group();
      [[0.42, '#ffffff'], [0.32, '#ff3d4f'], [0.2, '#ffffff'], [0.1, '#ff3d4f']].forEach(([r, c], k) => { const m = new THREE.Mesh(new THREE.CircleGeometry(r, 40), std(c, { roughness: 0.4, side: THREE.DoubleSide })); m.position.z = k * 0.004; g.add(m); });
      g.position.set(x, y, -1.3); s.add(g); });
    s.add(man('red', { number: 10, skin: 1, style: 'short' }, 'kick', 0.9, 1.4, Math.PI + 0.35, 1.1));   // спиной к нам — виден номер
    const b = ballM(0.2); b.position.set(0.15, 0.75, 0.2); s.add(b);
    return { pos: [0.3, 1.6, 5.4], look: [0.2, 0.95, -0.6], fov: 40 }; },
  mom(s) { const gl = goalM(0.55); gl.position.set(2.4, 0, -1.8); gl.rotation.y = -Math.PI / 2 - 0.35; s.add(gl);
    s.add(man('red', { number: 9, skin: 3, style: 'short' }, 'kick', 0.5, 1.0, 2.35, 1.15));
    const b = ballM(0.22); b.position.set(2.75, 0.95, -1.15); b.rotation.set(0.5, 1, 0.2); s.add(b);
    return { pos: [-0.2, 1.4, 4.9], look: [1.1, 0.9, -0.4], fov: 36 }; },
  three(s) { [[-0.72, -0.35, 'stand', 0.45, 7, 1, 'short'], [0, 0.25, 'run', 0.05, 10, 4, 'afro'], [0.72, -0.35, 'stand', -0.45, 9, 2, 'medium']].forEach(([x, z, pose, ry, n, skin, style]) =>
    s.add(man('blue', { number: n, skin, style }, pose, x, z, ry, 1)));
    return { pos: [0, 1.4, 6.0], look: [0, 1.0, 0], fov: 34 }; },
  mgr(s) { const c = document.createElement('canvas'); c.width = 640; c.height = 440; const g = c.getContext('2d');
    const gg = g.createLinearGradient(0, 0, 0, 440); gg.addColorStop(0, '#2a9a4e'); gg.addColorStop(1, '#16703a'); g.fillStyle = gg; g.fillRect(0, 0, 640, 440);
    g.strokeStyle = '#eafff1'; g.lineWidth = 7; g.strokeRect(18, 18, 604, 404); g.beginPath(); g.moveTo(320, 18); g.lineTo(320, 422); g.stroke(); g.beginPath(); g.arc(320, 220, 60, 0, 7); g.stroke(); g.strokeRect(18, 130, 80, 180); g.strokeRect(542, 130, 80, 180);
    const dot = (x, y, col) => { g.fillStyle = col; g.beginPath(); g.arc(x, y, 22, 0, 7); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 5; g.stroke(); };
    [[150, 110], [150, 330], [240, 220], [400, 140], [400, 300], [520, 220]].forEach(([x, y], i) => dot(x, y, i < 3 ? '#ffd23c' : '#e3243f'));
    g.strokeStyle = '#ffd23c'; g.lineWidth = 9; g.setLineDash([22, 14]); g.beginPath(); g.moveTo(240, 220); g.quadraticCurveTo(330, 120, 400, 140); g.stroke();
    const tx = new THREE.CanvasTexture(c); tx.encoding = THREE.sRGBEncoding;
    const frame = std('#2b303a', { metalness: 0.6, roughness: 0.3 });
    const board = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.8, 0.1), [frame, frame, frame, frame, new THREE.MeshStandardMaterial({ map: tx, roughness: 0.35 }), frame]);
    board.scale.setScalar(0.8); board.position.set(0.35, 1.15, -0.3); board.rotation.set(-0.12, -0.32, 0); board.castShadow = true; s.add(board);
    s.add(man('navy', { number: 8, skin: 2, style: 'buzz' }, 'stand', -0.8, 0.7, 0.55, 1));
    return { pos: [0, 1.4, 5.6], look: [-0.1, 1.0, 0], fov: 34 }; },
  eleven(s) { s.add(man('redS', { number: 9, skin: 2, style: 'short' }, 'run', -0.55, 0.05, 1.2, 1.05));
    s.add(man('blue', { number: 11, skin: 5, style: 'afro' }, 'run2', 0.55, -0.25, -1.9, 1.05));
    const ball = ballM(0.2); ball.position.set(0.05, 0.2, 0.55); s.add(ball);
    return { pos: [0, 1.4, 5.6], look: [0, 0.95, 0], fov: 34 }; },
  // драфт (3.11): игрок и веер из трёх золотых карточек за спиной
  draft(s) { const card = (x, y, rz, k) => { const c = document.createElement('canvas'); c.width = 200; c.height = 280; const g = c.getContext('2d');
      const gr = g.createLinearGradient(0, 0, 200, 280); gr.addColorStop(0, '#fff1b8'); gr.addColorStop(0.45, '#e2b43a'); gr.addColorStop(1, '#8a5a00'); g.fillStyle = gr;
      g.beginPath(); g.roundRect(6, 6, 188, 268, 22); g.fill(); g.strokeStyle = '#fff6d0'; g.lineWidth = 6; g.stroke();
      g.fillStyle = '#3b2a05'; g.font = '900 64px sans-serif'; g.fillText(String(88 + k), 22, 76); g.font = '800 26px sans-serif'; g.fillText(['ФРВ', 'ЦП', 'ЦЗ'][k], 26, 108);
      g.fillStyle = 'rgba(60,40,5,.25)'; g.beginPath(); g.arc(120, 150, 50, 0, 7); g.fill(); g.fillRect(40, 196, 120, 14); g.fillRect(56, 222, 88, 10);
      const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
      const m = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 1.33), new THREE.MeshStandardMaterial({ map: t, transparent: true, roughness: 0.3, metalness: 0.4, side: THREE.DoubleSide }));
      m.position.set(x, y, -0.6); m.rotation.z = rz; m.castShadow = true; s.add(m); };
    card(-0.85, 1.55, 0.28, 0); card(0, 1.75, 0, 1); card(0.85, 1.55, -0.28, 2);
    s.add(man('blue', { number: 10, skin: 2, style: 'short' }, 'stand', 0, 0.4, 0.15, 1.05));
    return { pos: [0, 1.4, 6.0], look: [0, 1.15, 0], fov: 34 }; },
  train(s) { [[-0.95, -0.4], [-0.3, 0.1], [0.35, -0.4], [1.0, 0.1]].forEach(([x, z]) => s.add(cone(x, z, 0.7)));
    s.add(man('navy', { number: 17, skin: 3, style: 'medium' }, 'run', 0.3, 0.9, -0.9, 1.1));
    const b = ballM(0.2); b.position.set(-0.25, 0.2, 1.25); b.rotation.set(0.4, 0.8, 0); s.add(b);
    return { pos: [0.2, 2.0, 5.9], look: [0.1, 0.75, 0], fov: 34 }; },
};
// tall — высокая плашка «Играть»: шире угол, все фигуры целиком
// плашки «Играть» без игроков (3.11): только предметы — мини-поле с фишками, ворота с мячом, доска, карточки, фишки
function miniPitch(n) { const c = document.createElement('canvas'); c.width = 420; c.height = 600; const g = c.getContext('2d');
  for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#2f9a52' : '#36a85b'; g.fillRect(0, i * 75, 420, 75); }
  g.strokeStyle = '#eafff1'; g.lineWidth = 8; g.strokeRect(16, 16, 388, 568); g.beginPath(); g.moveTo(16, 300); g.lineTo(404, 300); g.stroke(); g.beginPath(); g.arc(210, 300, 54, 0, 7); g.stroke();
  g.strokeRect(120, 16, 180, 70); g.strokeRect(120, 514, 180, 70);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  const m = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.08, 3.0), [std('#1d6b38'), std('#1d6b38'), new THREE.MeshStandardMaterial({ map: t, roughness: 0.6 }), std('#1d6b38'), std('#1d6b38'), std('#1d6b38')]);
  m.receiveShadow = true; m.castShadow = true; const grp = new THREE.Group(); grp.add(m);
  const tok = (x, z, col) => { const k = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.14, 32), std(col, { metalness: 0.3, roughness: 0.25 })); k.position.set(x, 0.11, z); k.castShadow = true; grp.add(k);
    const r = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.025, 8, 32), std('#ffffff')); r.rotation.x = Math.PI / 2; r.position.set(x, 0.18, z); grp.add(r); };
  const us = n === 3 ? [[0, 1.25], [-0.5, 0.45], [0.45, -0.2]] : [[0, 1.25], [-0.55, 0.6], [0.55, 0.6], [0, -0.15]];
  const them = n === 3 ? [[0, -1.25], [0.5, -0.5], [-0.4, 0.1]] : [[0, -1.25], [-0.55, -0.6], [0.55, -0.6], [0.1, 0.2]];
  us.forEach(([x, z]) => tok(x, z, '#2b6cff')); them.forEach(([x, z]) => tok(x, z, '#e3243f'));
  const b = ballM(0.13); b.position.set(0.25, 0.2, -0.05); grp.add(b); return grp; }
const PLATE = {
  three(s) { const p = miniPitch(3); p.rotation.set(0.15, 0.35, 0); s.add(p); return { pos: [0, 3.4, 3.6], look: [0, 0, 0.1], fov: 40 }; },
  eleven(s) { const p = miniPitch(4); p.rotation.set(0.15, -0.35, 0); s.add(p); return { pos: [0, 3.4, 3.6], look: [0, 0, 0.1], fov: 40 }; },
  mom(s) { const gl = goalM(0.5); gl.position.set(0, 0, -0.8); gl.rotation.y = Math.PI / 2; s.add(gl);
    const b = ballM(0.22); b.position.set(0.55, 0.75, -0.55); b.rotation.set(0.4, 0.8, 0.2); s.add(b);
    const pts = [new THREE.Vector3(-0.9, 0.15, 1.6), new THREE.Vector3(-0.1, 0.95, 0.5), new THREE.Vector3(0.45, 0.78, -0.45)];
    s.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 60, 0.018, 8), new THREE.MeshBasicMaterial({ color: L('#c6ff3d'), transparent: true, opacity: 0.85 })));
    return { pos: [-0.6, 1.5, 4.4], look: [0.1, 0.7, -0.4], fov: 42 }; },
  mgr(s) { const v = SCENES.mgr(s); s.children.filter((o) => o.type === 'Group' && o.children.some((c) => c.isSkinnedMesh)).forEach((o) => s.remove(o)); return { pos: [0.35, 1.2, 3.6], look: [0.35, 1.1, -0.3], fov: 40 }; },
  draft(s) { const v = SCENES.draft(s); return { pos: [0, 1.65, 5.2], look: [0, 1.55, -0.6], fov: 34 }; },
  train(s) { [[-0.6, -0.5], [0.1, -0.1], [-0.3, 0.5], [0.45, 0.85]].forEach(([x, z]) => s.add(cone(x, z, 0.9))); const b = ballM(0.28); b.position.set(0.5, 0.28, 0.2); s.add(b);
    const pts = []; for (let i = 0; i <= 40; i++) { const t = i / 40, z = -0.9 + t * 2.2; pts.push(new THREE.Vector3(Math.sin(t * Math.PI * 2.2) * 0.45, 0.03, z)); }
    s.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 100, 0.035, 8), new THREE.MeshBasicMaterial({ color: L('#ffd23c') })));
    return { pos: [0, 2.6, 3.4], look: [0, 0.2, 0], fov: 40 }; },
};
window.renderPlate = async (id, w, h) => { await ready; const s = rig(w, h); NOMEN = true; let v; try { v = PLATE[id](s); } finally { NOMEN = false; } const cam = new THREE.PerspectiveCamera(v.fov, w / h, 0.1, 100); cam.position.set(...v.pos); cam.lookAt(...v.look); R.render(s, cam); return R.domElement.toDataURL('image/png'); };
window.renderMode = async (id, w, h, tall) => { await ready; const s = rig(w, h), v = SCENES[id](s); const cam = new THREE.PerspectiveCamera(v.fov * (tall ? 1.45 : 1), w / h, 0.1, 100); cam.position.set(...v.pos); cam.lookAt(...v.look); R.render(s, cam); return R.domElement.toDataURL('image/png'); };
// ?view=mom — показать сцену в окне (для подбора кадра)
const VIEW = new URLSearchParams(location.search).get('view');
if (VIEW) { document.body.style.background = '#1a2433'; window.renderMode(VIEW, 900, 600).then(() => { document.title = 'ok ' + VIEW; }, (e) => { document.title = 'error ' + e; }); }
</script></body></html>
