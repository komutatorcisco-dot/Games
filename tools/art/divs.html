<!doctype html>
<!-- Значки дивизионов (21.11): 3D-щит из металла ступени (бронза, серебро, золото, элита), внутри эмаль и номер,
     сверху звезда (у элиты — корона), у золота и элиты — лавры по бокам. window.renderDiv(i, w, h) → PNG (dataURL).
     Рендер: node tools/art/render.js divs → img/div/d{0..9}-{384,192}.webp -->
<html><head><meta charset="utf-8"><style>@font-face{font-family:IB;font-weight:800;src:url(fonts/inter-800.ttf)}html,body{margin:0;background:transparent}</style></head>
<body><script src="../../vendor/three.min.js"></script><script>
'use strict';
const L = (h) => new THREE.Color(h).convertSRGBToLinear();
// металл, эмаль, свет номера, ореол
const TIERS = {
  bronze: { metal: '#c9824a', hi: '#ffd2a8', enamel: '#4a1204', lit: '#ff6a1a', ink: ['#fff1e2', '#e7a06a'], halo: '#e9a06a' },
  silver: { metal: '#c9d3e2', hi: '#ffffff', enamel: '#0b1f5c', lit: '#3d8bff', ink: ['#ffffff', '#a9b9d2'], halo: '#bcd2ff' },
  gold: { metal: '#f0b52a', hi: '#fff0b0', enamel: '#3a0a2e', lit: '#d4246e', ink: ['#fff7d0', '#ffc533'], halo: '#ffd23c' },
  elite: { metal: '#2a3420', hi: '#c6ff3d', enamel: '#061206', lit: '#5fd21a', ink: ['#f4ffd0', '#c6ff3d'], halo: '#c6ff3d', trim: '#c6ff3d' },
};
const tierOf = (i) => (i >= 9 ? 'elite' : i >= 6 ? 'gold' : i >= 3 ? 'silver' : 'bronze');
let R = null;
function rig(w, h, T) {
  if (!R) { R = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); R.outputEncoding = THREE.sRGBEncoding; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.05; document.body.appendChild(R.domElement); }
  R.setPixelRatio(1); R.setSize(w, h); R.setClearColor(0, 0);
  const s = new THREE.Scene();
  s.add(new THREE.HemisphereLight(0xeef3ff, 0x1a1420, 0.55));
  const k = new THREE.DirectionalLight(0xffffff, 1.6); k.position.set(-3, 5, 6); s.add(k);
  const r = new THREE.PointLight(L(T.halo), 2.5, 14); r.position.set(3, -1, 3); s.add(r);
  // окружение для отражений металла: тёмная сфера и две яркие «софтбокс»-плашки
  const env = new THREE.Scene(); env.add(new THREE.Mesh(new THREE.SphereGeometry(30, 16, 8), new THREE.MeshBasicMaterial({ color: 0x0b0f1c, side: THREE.BackSide })));
  [[-7, 6, 7, 0xffffff], [8, 2, 6, 0xffffff], [0, -8, 6, new THREE.Color(T.halo).getHex()]].forEach(([x, y, z, c]) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(9, 5), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m); });
  s.environment = new THREE.PMREMGenerator(R).fromScene(env, 0.03).texture;
  // ореол — в CSS (.dvb2-glow): в кадре он обрезался бы краем картинки и давал квадрат
  return s;
}
function tex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t; }
// контур щита: плоский верх с выступами по углам, бока сходятся к острию
function shield(k = 1) {
  const p = new THREE.Shape(), S = (x, y) => [x * k, y * k];
  p.moveTo(...S(0, 1.32));
  p.bezierCurveTo(...S(0.38, 1.12), ...S(0.72, 1.18), ...S(1.02, 1.28));
  p.bezierCurveTo(...S(1.06, 0.6), ...S(1.04, -0.15), ...S(0.72, -0.72));
  p.bezierCurveTo(...S(0.46, -1.1), ...S(0.18, -1.3), ...S(0, -1.42));
  p.bezierCurveTo(...S(-0.18, -1.3), ...S(-0.46, -1.1), ...S(-0.72, -0.72));
  p.bezierCurveTo(...S(-1.04, -0.15), ...S(-1.06, 0.6), ...S(-1.02, 1.28));
  p.bezierCurveTo(...S(-0.72, 1.18), ...S(-0.38, 1.12), ...S(0, 1.32));
  return p;
}
function star(r1, r2, n = 5) { const p = new THREE.Shape(); for (let i = 0; i <= n * 2; i++) { const a = Math.PI / 2 + i * Math.PI / n, r = i % 2 ? r2 : r1; const x = Math.cos(a) * r, y = Math.sin(a) * r; i ? p.lineTo(x, y) : p.moveTo(x, y); } return p; }
const metal = (c, o = {}) => new THREE.MeshStandardMaterial({ color: L(c), metalness: 1, roughness: 0.22, envMapIntensity: 1.4, ...o });
const ext = (shape, depth, bevel, mat) => { const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 6, curveSegments: 48 }); g.center(); return new THREE.Mesh(g, mat); };
window.renderDiv = async (i, w, h) => {
  await document.fonts.load('800 40px IB');
  const tn = tierOf(i), T = TIERS[tn], s = rig(w, h, T), G = new THREE.Group(); s.add(G);
  // обод и эмаль
  const rim = ext(shield(1), 0.22, 0.1, metal(T.metal, tn === 'elite' ? { roughness: 0.35 } : {})); G.add(rim);
  // эмаль: насыщенный цвет, свет в центре, тёмные края (виньетка), едва заметные лучи
  const em = tex(512, 512, (g) => { g.fillStyle = T.enamel; g.fillRect(0, 0, 512, 512);
    const c = g.createRadialGradient(256, 236, 0, 256, 236, 250); c.addColorStop(0, T.lit + 'aa'); c.addColorStop(0.55, T.lit + '33'); c.addColorStop(1, T.lit + '00'); g.fillStyle = c; g.fillRect(0, 0, 512, 512);
    g.globalAlpha = 0.07; g.fillStyle = '#ffffff';
    for (let k = 0; k < 24; k++) { const a = k * Math.PI / 12; g.beginPath(); g.moveTo(256, 236); g.arc(256, 236, 520, a, a + Math.PI / 24); g.closePath(); g.fill(); }
    g.globalAlpha = 1; const v = g.createRadialGradient(256, 256, 140, 256, 256, 340); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.7)'); g.fillStyle = v; g.fillRect(0, 0, 512, 512); });
  em.repeat.set(0.31, 0.31); em.offset.set(0.5, 0.5);
  const inner = ext(shield(0.8), 0.06, 0.04, new THREE.MeshStandardMaterial({ color: 0xffffff, map: em, emissive: 0xffffff, emissiveMap: em, emissiveIntensity: 0.55, metalness: 0, roughness: 0.18, envMapIntensity: 0.5 })); inner.position.set(0, 0.0, 0.17); G.add(inner);
  if (T.trim) { const tr = ext(shield(0.86), 0.02, 0.02, new THREE.MeshBasicMaterial({ color: L(T.trim) })); tr.position.z = 0.15; G.add(tr); }
  // номер: металлический градиент с тенью, на плоскости над эмалью
  const num = i >= 9 ? '★' : String(10 - i);
  const nt = tex(512, 512, (g) => { g.textAlign = 'center'; g.textBaseline = 'middle'; const big = num.length > 1 ? 330 : 380;
    g.font = `800 ${i >= 9 ? 330 : big}px IB`; const x = 256, y = 276;
    g.lineJoin = 'round'; g.lineWidth = 22; g.strokeStyle = 'rgba(0,0,0,.6)'; g.strokeText(num, x + 6, y + 10); g.fillStyle = 'rgba(0,0,0,.6)'; g.fillText(num, x + 6, y + 10);
    const q = g.createLinearGradient(0, 110, 0, 420); q.addColorStop(0, T.ink[0]); q.addColorStop(0.55, T.ink[1]); q.addColorStop(1, T.ink[1]); g.fillStyle = q; g.fillText(num, x, y);
    });
  const np = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 1.6), new THREE.MeshBasicMaterial({ map: nt, transparent: true, depthWrite: false })); np.position.set(0, -0.05, 0.25); G.add(np);
  // блик стекла поверх эмали
  const gl = new THREE.Mesh(new THREE.PlaneGeometry(2, 2.4), new THREE.MeshBasicMaterial({ map: tex(256, 256, (g) => { const q = g.createLinearGradient(0, 0, 256, 256); q.addColorStop(0, 'rgba(255,255,255,.12)'); q.addColorStop(0.45, 'rgba(255,255,255,.02)'); q.addColorStop(0.5, 'rgba(255,255,255,0)'); g.fillStyle = q; g.fillRect(0, 0, 256, 256); }), transparent: true, depthWrite: false }));
  gl.position.set(0, 0, 0.26); gl.scale.set(0.78, 0.78, 1); G.add(gl);
  // сверху: звёзды по номеру внутри ступени (1–3), у элиты — корона
  const top = new THREE.Group(); G.add(top); top.position.set(0, 1.42, 0.05);
  if (tn === 'elite') {
    const cr = new THREE.Shape(); cr.moveTo(-0.5, 0); cr.lineTo(-0.56, 0.42); cr.lineTo(-0.26, 0.2); cr.lineTo(0, 0.55); cr.lineTo(0.26, 0.2); cr.lineTo(0.56, 0.42); cr.lineTo(0.5, 0); cr.lineTo(-0.5, 0);
    const c = ext(cr, 0.12, 0.04, metal('#f0c23a')); c.position.y = 0.12; top.add(c);
    [-0.56, 0, 0.56].forEach((x, k) => { const b = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 12), new THREE.MeshBasicMaterial({ color: L('#c6ff3d') })); b.position.set(x, (k === 1 ? 0.55 : 0.42) - 0.275 + 0.12, 0.1); top.add(b); });
  } else {
    const n = (i % 3) + 1; for (let k = 0; k < n; k++) { const st = ext(star(0.2, 0.09), 0.06, 0.03, metal(T.hi === '#ffffff' ? '#e8eef8' : T.metal)); st.position.set((k - (n - 1) / 2) * 0.42, 0.12 + (k === (n - 1) / 2 ? 0.06 : 0), 0); top.add(st); }
  }
  // лавры у золота и элиты
  if (tn === 'gold' || tn === 'elite') {
    const lm = metal(tn === 'elite' ? '#c6ff3d' : T.metal, tn === 'elite' ? { metalness: 0.6, roughness: 0.3, emissive: L('#3c6a00'), emissiveIntensity: 0.6 } : {});
    [-1, 1].forEach((sx) => {
      const P = (a, rr = 1.3) => new THREE.Vector3(sx * Math.cos(a) * rr * 0.95, Math.sin(a) * rr - 0.12, -0.12);
      const a0 = -1.72, a1 = 0.35, stem = new THREE.CatmullRomCurve3([0, 0.25, 0.5, 0.75, 1].map((t) => P(a0 + (a1 - a0) * t)));
      G.add(new THREE.Mesh(new THREE.TubeGeometry(stem, 40, 0.035, 8), lm));
      for (let k = 0; k < 8; k++) { const t = 0.08 + k / 8.2, a = a0 + (a1 - a0) * t, sz = 0.85 + 0.25 * Math.sin(t * Math.PI);
        const pt = P(a), tg = stem.getTangent(Math.min(1, t)); const ang = Math.atan2(tg.y, tg.x);
        [-1, 1].forEach((side) => { const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.15, 18, 10), lm); leaf.scale.set(0.38 * sz, 1.05 * sz, 0.28);
          leaf.rotation.z = ang - Math.PI / 2 + side * 0.65; const off = new THREE.Vector3(Math.cos(ang + side * Math.PI / 2), Math.sin(ang + side * Math.PI / 2), 0).multiplyScalar(0.1 * sz);
          leaf.position.copy(pt).add(off).add(new THREE.Vector3(tg.x, tg.y, 0).multiplyScalar(0.06)); G.add(leaf); }); }
    });
  }
  G.rotation.set(-0.08, -0.32, 0.02);
  const cam = new THREE.PerspectiveCamera(30, w / h, 0.1, 50); cam.position.set(0, 0.25, 7.6); cam.lookAt(0, 0.12, 0);
  R.render(s, cam); return R.domElement.toDataURL('image/png');
};
</script></body></html>
