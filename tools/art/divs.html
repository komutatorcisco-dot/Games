<!doctype html>
<!-- Значки дивизионов (21.11): 3D-щит из металла ступени (бронза, серебро, золото, элита), внутри эмаль и номер,
     сверху звезда (у элиты — корона), у золота и элиты — лавры по бокам. window.renderDiv(i, w, h) → PNG (dataURL).
     Рендер: node tools/art/render.js divs → img/div/d{0..9}-{384,192}.webp -->
<html><head><meta charset="utf-8"><style>@font-face{font-family:IB;font-weight:800;src:url(fonts/inter-800.ttf)}html,body{margin:0;background:transparent}</style></head>
<body><script src="../../vendor/three.min.js"></script><script>
'use strict';
const L = (h) => new THREE.Color(h).convertSRGBToLinear();
// металл, эмаль, свет номера, ореол
const TIERS = {
  bronze: { metal: '#c9824a', hi: '#ffd2a8', enamel: '#4a1204', lit: '#ff6a1a', ink: ['#fff1e2', '#e7a06a'], halo: '#e9a06a' },
  silver: { metal: '#c9d3e2', hi: '#ffffff', enamel: '#0b1f5c', lit: '#3d8bff', ink: ['#ffffff', '#a9b9d2'], halo: '#bcd2ff' },
  gold: { metal: '#f0b52a', hi: '#fff0b0', enamel: '#3a0a2e', lit: '#d4246e', ink: ['#fff7d0', '#ffc533'], halo: '#ffd23c' },
  elite: { metal: '#2a3420', hi: '#c6ff3d', enamel: '#061206', lit: '#5fd21a', ink: ['#f4ffd0', '#c6ff3d'], halo: '#c6ff3d', trim: '#c6ff3d' },
};
const tierOf = (i) => (i >= 9 ? 'elite' : i >= 6 ? 'gold' : i >= 3 ? 'silver' : 'bronze');
let R = null;
function rig(w, h, T) {
  if (!R) { R = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); R.outputEncoding = THREE.sRGBEncoding; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.05; document.body.appendChild(R.domElement); }
  R.setPixelRatio(1); R.setSize(w, h); R.setClearColor(0, 0);
  const s = new THREE.Scene();
  s.add(new THREE.HemisphereLight(0xeef3ff, 0x1a1420, 0.55));
  const k = new THREE.DirectionalLight(0xffffff, 1.6); k.position.set(-3, 5, 6); s.add(k);
  const r = new THREE.PointLight(L(T.halo), 2.5, 14); r.position.set(3, -1, 3); s.add(r);
  // окружение для отражений металла: тёмная сфера и две яркие «софтбокс»-плашки
  const env = new THREE.Scene(); env.add(new THREE.Mesh(new THREE.SphereGeometry(30, 16, 8), new THREE.MeshBasicMaterial({ color: 0x0b0f1c, side: THREE.BackSide })));
  [[-7, 6, 7, 0xffffff], [8, 2, 6, 0xffffff], [0, -8, 6, new THREE.Color(T.halo).getHex()]].forEach(([x, y, z, c]) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(9, 5), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m); });
  s.environment = new THREE.PMREMGenerator(R).fromScene(env, 0.03).texture;
  // ореол — в CSS (.dvb2-glow): в кадре он обрезался бы краем картинки и давал квадрат
  return s;
}
function tex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t; }
// контур щита: плоский верх с выступами по углам, бока сходятся к острию
function shield(k = 1) {
  const p = new THREE.Shape(), S = (x, y) => [x * k, y * k];
  p.moveTo(...S(0, 1.32));
  p.bezierCurveTo(...S(0.38, 1.12), ...S(0.72, 1.18), ...S(1.02, 1.28));
  p.bezierCurveTo(...S(1.06, 0.6), ...S(1.04, -0.15), ...S(0.72, -0.72));
  p.bezierCurveTo(...S(0.46, -1.1), ...S(0.18, -1.3), ...S(0, -1.42));
  p.bezierCurveTo(...S(-0.18, -1.3), ...S(-0.46, -1.1), ...S(-0.72, -0.72));
  p.bezierCurveTo(...S(-1.04, -0.15), ...S(-1.06, 0.6), ...S(-1.02, 1.28));
  p.bezierCurveTo(...S(-0.72, 1.18), ...S(-0.38, 1.12), ...S(0, 1.32));
  return p;
}
function star(r1, r2, n = 5) { const p = new THREE.Shape(); for (let i = 0; i <= n * 2; i++) { const a = Math.PI / 2 + i * Math.PI / n, r = i % 2 ? r2 : r1; const x = Math.cos(a) * r, y = Math.sin(a) * r; i ? p.lineTo(x, y) : p.moveTo(x, y); } return p; }
const metal = (c, o = {}) => new THREE.MeshStandardMaterial({ color: L(c), metalness: 1, roughness: 0.22, envMapIntensity: 1.4, ...o });
const ext = (shape, depth, bevel, mat) => { const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 6, curveSegments: 48 }); g.center(); return new THREE.Mesh(g, mat); };
// 23.11: новый значок в мультяшном стиле мячей пользователя — толстая глянцевая оправа-щит, в центре гранёный
// самоцвет цвета ступени с крупным белым номером, крылья растут со ступенью (серебро — малые, золото и элита — большие),
// сверху маленький мяч (у элиты — корона), снизу звёзды — место внутри ступени
const G2 = {
  bronze: { rim: '#d9772e', rimHi: '#ffb070', gem: '#ff6a1a', gemD: '#9a2a00', wing: 0 },
  silver: { rim: '#b9c7dc', rimHi: '#ffffff', gem: '#2f8cff', gemD: '#0b2f8a', wing: 1 },
  gold: { rim: '#ffb800', rimHi: '#fff0a0', gem: '#ff2e63', gemD: '#7a0024', wing: 2 },
  elite: { rim: '#1c2414', rimHi: '#c6ff3d', gem: '#7cff1a', gemD: '#1f6a00', wing: 2, crown: true },
};
const gp = (c, o = {}) => new THREE.MeshPhysicalMaterial({ color: L(c), roughness: 0.22, metalness: 0.25, clearcoat: 1, clearcoatRoughness: 0.08, ...o });
function hexShape(r, k = 1) { const p = new THREE.Shape(); for (let j = 0; j <= 6; j++) { const a = Math.PI / 2 + j * Math.PI / 3; const x = Math.cos(a) * r, y = Math.sin(a) * r * k; j ? p.lineTo(x, y) : p.moveTo(x, y); } return p; }
function wingShape() { // одно крыло (правое): три пера
  const p = new THREE.Shape(); p.moveTo(0, 0.35); p.bezierCurveTo(0.5, 0.75, 1.1, 0.85, 1.35, 0.7); p.bezierCurveTo(1.05, 0.55, 0.95, 0.45, 1.25, 0.3);
  p.bezierCurveTo(0.95, 0.2, 0.85, 0.05, 1.05, -0.12); p.bezierCurveTo(0.7, -0.12, 0.45, -0.25, 0.7, -0.45); p.bezierCurveTo(0.3, -0.4, 0.05, -0.2, 0, -0.1); p.lineTo(0, 0.35); return p; }
window.renderDiv = async (i, w, h) => {
  await document.fonts.load('800 40px IB');
  const tn = tierOf(i), T = G2[tn], s = rig(w, h, TIERS[tn]), G = new THREE.Group(); s.add(G);
  R.toneMapping = THREE.NoToneMapping;
  // крылья (за оправой)
  if (T.wing) { const sc = T.wing === 1 ? 0.72 : 1.05;
    [-1, 1].forEach((sx) => { const wg = ext(wingShape(), 0.14, 0.06, gp(tn === 'elite' ? '#c6ff3d' : T.rim, tn === 'elite' ? { emissive: L('#2a6a00'), emissiveIntensity: 0.5 } : {})); wg.geometry.translate(0.68, 0.1, 0);
      wg.scale.set(sx * sc, sc, 1); wg.position.set(sx * 0.72, 0.15, -0.25); G.add(wg); }); }
  // оправа: толстый скруглённый шестиугольник
  const rim = ext(hexShape(1.12, 1.08), 0.34, 0.16, gp(T.rim, tn === 'elite' ? { metalness: 0.4 } : {})); G.add(rim);
  const rim2 = ext(hexShape(0.98, 1.08), 0.06, 0.05, gp(T.rimHi, { metalness: 0.5 })); rim2.position.z = 0.25; G.add(rim2);
  // самоцвет: гранёный (плоские грани), цвет ступени, светится изнутри
  const gemG = new THREE.CylinderGeometry(0.62, 0.86, 0.5, 6, 1); gemG.rotateX(Math.PI / 2); gemG.rotateZ(Math.PI / 6);
  const gem = new THREE.Mesh(gemG, new THREE.MeshPhysicalMaterial({ color: L(T.gem), emissive: L(T.gemD), emissiveIntensity: 0.9, roughness: 0.08, metalness: 0.1, clearcoat: 1, flatShading: true }));
  gem.scale.set(1, 1.08, 1); gem.position.z = 0.42; G.add(gem);
  // номер: крупный белый с тёмной обводкой (мультяшно)
  const num = i >= 9 ? '★' : String(10 - i);
  const nt = tex(512, 512, (g) => { g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = `800 ${num.length > 1 ? 300 : 360}px IB`; const x = 256, y = 270;
    g.lineJoin = 'round'; g.lineWidth = 46; g.strokeStyle = T.gemD; g.strokeText(num, x, y + 10);
    g.lineWidth = 30; g.strokeStyle = '#1a0a04'; g.strokeText(num, x, y);
    const q = g.createLinearGradient(0, 120, 0, 400); q.addColorStop(0, '#ffffff'); q.addColorStop(1, '#dfe8ff'); g.fillStyle = q; g.fillText(num, x, y); });
  const np = new THREE.Mesh(new THREE.PlaneGeometry(1.25, 1.25), new THREE.MeshBasicMaterial({ map: nt, transparent: true, depthWrite: false })); np.position.set(0, -0.02, 0.69); G.add(np);
  // блик на самоцвете
  const hl = new THREE.Mesh(new THREE.CircleGeometry(0.16, 24), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 })); hl.scale.set(1.4, 0.6, 1); hl.position.set(-0.32, 0.38, 0.7); hl.rotation.z = 0.5; G.add(hl);
  // сверху: мяч или корона
  if (T.crown) { const cr = new THREE.Shape(); cr.moveTo(-0.5, 0); cr.lineTo(-0.58, 0.46); cr.lineTo(-0.27, 0.22); cr.lineTo(0, 0.6); cr.lineTo(0.27, 0.22); cr.lineTo(0.58, 0.46); cr.lineTo(0.5, 0); cr.lineTo(-0.5, 0);
    const c = ext(cr, 0.16, 0.05, gp('#ffc21a', { metalness: 0.5 })); c.position.set(0, 1.42, 0.1); G.add(c);
  } else { const ball = new THREE.Mesh(new THREE.SphereGeometry(0.26, 32, 24), gp('#ffffff', { metalness: 0 })); ball.position.set(0, 1.42, 0.3); G.add(ball);
    for (let k = 0; k < 5; k++) { const a = k * 1.2566 + 0.3, pn = new THREE.Mesh(new THREE.CircleGeometry(0.07, 5), new THREE.MeshBasicMaterial({ color: 0x1a1a22 })); pn.position.set(Math.cos(a) * 0.17, 1.42 + Math.sin(a) * 0.17, 0.52); pn.lookAt(0, 1.42, 3); G.add(pn); }
    const pc = new THREE.Mesh(new THREE.CircleGeometry(0.075, 5), new THREE.MeshBasicMaterial({ color: 0x1a1a22 })); pc.position.set(0, 1.42, 0.565); G.add(pc); }
  // снизу: звёзды — место внутри ступени (1–3)
  const n = tn === 'elite' ? 3 : (i % 3) + 1;
  for (let k = 0; k < n; k++) { const st = ext(star(0.19, 0.085), 0.08, 0.03, gp('#ffd23a', { metalness: 0.4, emissive: L('#7a4a00'), emissiveIntensity: 0.3 })); st.position.set((k - (n - 1) / 2) * 0.42, -1.52 - (k === (n - 1) / 2 ? 0.06 : 0), 0.45); G.add(st); }
  G.rotation.set(-0.05, -0.22, 0);
  const cam = new THREE.PerspectiveCamera(30, w / h, 0.1, 50); cam.position.set(0, 0.1, 9.2); cam.lookAt(0, 0.06, 0);
  R.render(s, cam); return R.domElement.toDataURL('image/png');
};
</script></body></html>
