<!doctype html>
<!-- Генератор картинок паков: объёмный фольгированный пак на three.js. С 29.10 — в стиле логотипа канала:
     надпись «ДЖЕКСОНЫ» сверху, крупный знак «ДЖ» с хвостом движения, полосы скорости, цвет по уровню.
     Запуск: node tools/art/render.js packs — сохраняет img/packs/pk{0..4}-{360,160}.webp -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>@font-face{font-family:IB;font-weight:800;src:url(fonts/inter-800.ttf)}html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><script src="../../vendor/three.min.js"></script><script>
'use strict';
// цвета уровней: основа (тёмная, средняя, светлая), акцент, надпись
const TIERS = [
  { name: 'ОБЫЧНЫЙ', base: ['#0d1013', '#2f363e', '#8c96a2'], acc: '#e6ecf2', rim: ['#ffffff', '#b8c2cc', '#5a646e'], stars: 1 },
  { name: 'СВЕРХРЕДКИЙ', base: ['#040d26', '#1546b0', '#7fc8ff'], acc: '#56d4ff', rim: ['#ffffff', '#9fd6ff', '#2c5fa8'], stars: 2 },
  { name: 'ЭПИЧЕСКИЙ', base: ['#10042b', '#5323c4', '#d5b8ff'], acc: '#b98cff', rim: ['#ffffff', '#d2bbff', '#6a3fc0'], stars: 3 },
  { name: 'ЛЕГЕНДАРНЫЙ', base: ['#2a1600', '#b57a08', '#ffe9a0'], acc: '#ffd24a', rim: ['#fffbe6', '#ffd75a', '#9a6400'], stars: 4 },
  { name: 'ДЖЕКСОН!!', base: ['#030303', '#0d0f08', '#26300c'], acc: '#c6ff3d', rim: ['#f4ffd6', '#c6ff3d', '#5f8a00'], stars: 5 },
];
const cv = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h });
const star = (g, x, y, R, r) => { g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 5, q = i % 2 ? r : R; g.lineTo(x + q * Math.cos(a), y + q * Math.sin(a)); } g.closePath(); };
function shield(g, x, y, w, h) { // щит: прямой верх со скосами, острый низ
  g.beginPath(); g.moveTo(x - w / 2, y); g.lineTo(x - w * 0.36, y - h * 0.06); g.lineTo(x, y - h * 0.1); g.lineTo(x + w * 0.36, y - h * 0.06); g.lineTo(x + w / 2, y);
  g.lineTo(x + w / 2, y + h * 0.5); g.quadraticCurveTo(x + w / 2, y + h * 0.8, x, y + h * 0.95); g.quadraticCurveTo(x - w / 2, y + h * 0.8, x - w / 2, y + h * 0.5); g.closePath();
}
function metal(g, y0, y1, c) { const gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, c[0]); gr.addColorStop(0.45, c[1]); gr.addColorStop(0.55, c[2]); gr.addColorStop(1, c[1]); return gr; }
// хвост движения как у логотипа канала: сдвинутые копии со спадающей прозрачностью, левый край резкий
function smear(g, txt, x, y, fs, col, len, sharp) {
  const w = Math.ceil(g.measureText(txt).width + len + 20), h = Math.ceil(fs * 1.3), c = cv(w, h), q = c.getContext('2d'); q.font = g.font; q.fillStyle = col;
  const by = fs * 1.02, N = 60;
  for (let i = N; i >= 0; i--) { const t = i / N; q.globalAlpha = 0.06 * (1 - t) + 0.01; q.fillText(txt, t * len, by); }
  const s = cv(w, h), r = s.getContext('2d'); r.font = g.font; r.fillStyle = col; r.fillText(txt, 0, by);
  r.globalCompositeOperation = 'destination-in'; const gr = r.createLinearGradient(0, 0, g.measureText(txt).width, 0); gr.addColorStop(0, '#000'); gr.addColorStop(sharp, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)'); r.fillStyle = gr; r.fillRect(0, 0, w, h);
  q.globalAlpha = 1; q.drawImage(s, 0, 0); g.drawImage(c, x, y - by);
}
// белая надпись на прозрачном → залить металлом по её форме
function tint(c, paint) { const g = c.getContext('2d'); g.globalCompositeOperation = 'source-in'; paint(g); g.globalCompositeOperation = 'source-over'; return c; }
function wordmark(W, col) { // «ДЖЕКСОНЫ», «НЫ» уходит в движение
  const fs = 200, c = cv(1, 1); let g = c.getContext('2d'); g.font = `800 ${fs}px IB`;
  const pre = 'ДЖЕКСО', tr = -0.03 * fs, wp = [...pre].reduce((a, ch) => a + g.measureText(ch).width + tr, 0);
  c.width = Math.ceil(wp + g.measureText('НЫ').width + fs * 0.9 + 40); c.height = Math.ceil(fs * 1.15); g = c.getContext('2d'); g.font = `800 ${fs}px IB`; g.fillStyle = col;
  let x = 20; const y = fs * 0.95; for (const ch of pre) { g.fillText(ch, x, y); x += g.measureText(ch).width + tr; }
  smear(g, 'НЫ', x, y, fs, col, fs * 0.6, 0.62); return c;
}
function front(t) {
  const W = 1024, H = 1600, c = cv(W, H), g = c.getContext('2d'), CR = 70, lime = t.stars === 5;
  // основа: тёмная сверху и снизу, цвет уровня к центру
  const bg = g.createLinearGradient(0, 0, W * 0.35, H);
  bg.addColorStop(0, t.base[0]); bg.addColorStop(0.38, t.base[1]); bg.addColorStop(0.5, t.base[2]); bg.addColorStop(0.62, t.base[1]); bg.addColorStop(1, t.base[0]);
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  // свечение за знаком
  const gl = g.createRadialGradient(W / 2, H * 0.5, 40, W / 2, H * 0.5, 620); gl.addColorStop(0, t.acc + (lime ? '70' : '88')); gl.addColorStop(1, t.acc + '00');
  g.fillStyle = gl; g.fillRect(0, 0, W, H);
  // полосы скорости: тонкие горизонтальные штрихи, тают вправо (мотив логотипа)
  let seed = 7 + t.stars * 13; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  g.save(); g.translate(W / 2, H / 2); g.rotate(-0.14); g.translate(-W / 2, -H / 2);
  for (let i = 0; i < 46; i++) {
    const y = rnd() * H, x = -200 + rnd() * W * 0.8, len = 260 + rnd() * 700, hh = 3 + rnd() * (rnd() < 0.2 ? 26 : 9);
    const sg = g.createLinearGradient(x, 0, x + len, 0); sg.addColorStop(0, (rnd() < 0.5 ? '#ffffff' : t.acc) + '00'); sg.addColorStop(0.15, (i % 3 ? t.acc : '#ffffff') + '55'); sg.addColorStop(1, t.acc + '00');
    g.fillStyle = sg; g.fillRect(x, y, len, hh);
  }
  g.restore();
  // тонкая «шлифовка» фольги
  g.save(); g.globalAlpha = 0.05; g.fillStyle = '#fff'; for (let y = 0; y < H; y += 6) g.fillRect(0, y, W, 1); g.restore();
  // надпись канала сверху
  const wm = wordmark(W, '#fff'), ww = 600, wh = wm.height * ww / wm.width;
  g.save(); g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = 14; g.drawImage(wm, (W - ww) / 2 + 30, CR + 70, ww, wh); g.restore();
  // уровень — штрихи как в интерфейсе
  const py = CR + 100 + wh, pw = 64, pg = 14, n = 5, px0 = W / 2 - (n * pw + (n - 1) * pg) / 2;
  for (let i = 0; i < n; i++) { g.fillStyle = i < t.stars ? t.acc : 'rgba(255,255,255,.18)'; if (i < t.stars) { g.shadowColor = t.acc; g.shadowBlur = 14; } g.beginPath(); g.roundRect(px0 + i * (pw + pg), py, pw, 12, 6); g.fill(); g.shadowBlur = 0; }
  // знак «ДЖ»: Ж уходит в движение; залит металлом уровня
  const fs = 420, mk = cv(W, 760), mg = mk.getContext('2d'); mg.font = `800 ${fs}px IB`; mg.fillStyle = '#fff';
  const wd = mg.measureText('Д').width - fs * 0.03, wz = mg.measureText('Ж').width, x0 = (W - (wd + wz + fs * 0.2)) / 2, my = 560;
  mg.fillText('Д', x0, my); smear(mg, 'Ж', x0 + wd, my, fs, '#fff', fs * 0.36, 0.55);
  tint(mk, (q) => { const m = q.createLinearGradient(0, my - fs * 0.75, 0, my); m.addColorStop(0, t.rim[0]); m.addColorStop(0.48, t.rim[1]); m.addColorStop(0.52, t.rim[2]); m.addColorStop(1, t.rim[1]); q.fillStyle = m; q.fillRect(0, 0, W, 760); });
  const myTop = H * 0.5 - 470;
  g.save(); g.shadowColor = 'rgba(0,0,0,.65)'; g.shadowBlur = 40; g.shadowOffsetY = 22; g.drawImage(mk, 0, myTop); g.restore();
  g.save(); g.globalAlpha = 0.18; g.globalCompositeOperation = 'lighter'; g.drawImage(mk, 0, myTop); g.restore();
  // уровень пака снизу: линия акцента, название, «пак игроков»
  const by = H * 0.775;
  g.fillStyle = t.acc; g.fillRect(W / 2 - 230, by - 70, 460, 8);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const nfs = t.name.length > 10 ? 92 : 110; g.font = `800 ${nfs}px IB`;
  g.save(); g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 16; g.fillStyle = '#fff'; g.fillText(t.name, W / 2, by + 20); g.restore();
  g.font = '800 44px IB'; g.fillStyle = lime ? t.acc : 'rgba(255,255,255,.7)'; g.fillText('П А К   И Г Р О К О В', W / 2, by + 125);
  // обжим: рёбра сверху и снизу, зубчатый край — прозрачный
  [0, H - CR].forEach((y0) => {
    const gr = g.createLinearGradient(0, y0, 0, y0 + CR); gr.addColorStop(0, t.rim[2]); gr.addColorStop(0.5, t.rim[1]); gr.addColorStop(1, t.rim[2]);
    g.fillStyle = gr; g.fillRect(0, y0, W, CR);
    g.globalAlpha = 0.3; for (let x = 0; x < W; x += 12) { g.fillStyle = (x / 12) % 2 ? '#000' : '#fff'; g.fillRect(x, y0, 6, CR); } g.globalAlpha = 1;
  });
  g.globalCompositeOperation = 'destination-out';
  [[0, 1], [H, -1]].forEach(([y0, d]) => { g.beginPath(); g.moveTo(0, y0); for (let x = 0; x <= W; x += 32) g.lineTo(x + 16, y0 + d * 18), g.lineTo(x + 32, y0); g.closePath(); g.fill(); });
  g.globalCompositeOperation = 'source-over';
  return c;
}
function backTex(t) { const c = cv(512, 800), g = c.getContext('2d'); const bg = g.createLinearGradient(0, 0, 512, 800); bg.addColorStop(0, t.base[0]); bg.addColorStop(0.5, t.base[1]); bg.addColorStop(1, t.base[0]); g.fillStyle = bg; g.fillRect(0, 0, 512, 800); return c; }

let R = null;
async function render(lv, w, h) {
  await Promise.all(['italic 900 40px JB', 'italic 900 40px JR', '800 40px IB'].map((f) => document.fonts.load(f, 'JGЖ'))); await document.fonts.ready;
  const t = TIERS[lv];
  if (!R) {
    R = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    R.outputEncoding = THREE.sRGBEncoding; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.05;
    document.body.appendChild(R.domElement);
  }
  R.setPixelRatio(1); R.setSize(w, h); R.setClearColor(0x000000, 0);
  const scene = new THREE.Scene();
  // окружение для отражений: тёмная сфера и светлые «софтбоксы»
  const env = new THREE.Scene(); env.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), new THREE.MeshBasicMaterial({ color: 0x0a0d18, side: THREE.BackSide })));
  [[-14, 10, 12, 0xffffff, 10, 18], [16, 4, 10, 0xffeedd, 6, 14], [0, -14, 8, 0x8899ff, 20, 4], [0, 18, -6, 0xffffff, 24, 4]].forEach(([x, y, z, col, sw, sh]) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(sw, sh), new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m); });
  const pm = new THREE.PMREMGenerator(R); scene.environment = pm.fromScene(env, 0.02).texture;
  const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(-3, 4, 6); scene.add(key);
  scene.add(new THREE.AmbientLight(0xffffff, 0.25));
  // тело пака: пластина, выпуклая к центру, зубчатые края берутся из прозрачности текстуры
  const PW = 2, PH = 3.125, geo = new THREE.PlaneGeometry(PW, PH, 64, 100), p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i) / (PW / 2), y = p.getY(i) / (PH / 2), crimp = Math.abs(y) > 0.9; p.setZ(i, crimp ? 0.004 : 0.16 * (1 - Math.pow(Math.abs(x), 3)) * (1 - Math.pow(Math.abs(y) / 0.9, 8))); }
  geo.computeVertexNormals();
  const tex = new THREE.CanvasTexture(front(t)); tex.encoding = THREE.sRGBEncoding; tex.anisotropy = 8;
  const mat = new THREE.MeshStandardMaterial({ map: tex, metalness: lv === 4 ? 0.5 : 0.62, roughness: 0.3, envMapIntensity: 1.25, transparent: true, alphaTest: 0.5, side: THREE.FrontSide });
  const pack = new THREE.Group(), fr = new THREE.Mesh(geo, mat); pack.add(fr);
  const bt = new THREE.CanvasTexture(backTex(t)); bt.encoding = THREE.sRGBEncoding;
  const back = new THREE.Mesh(geo.clone(), new THREE.MeshStandardMaterial({ map: bt, metalness: 0.5, roughness: 0.4 })); back.rotation.y = Math.PI; pack.add(back);
  pack.rotation.set(-0.06, -0.32, 0.035); scene.add(pack);
  const cam = new THREE.PerspectiveCamera(26, w / h, 0.1, 100); cam.position.set(0, 0, 7.4); cam.lookAt(0, 0, 0);
  R.render(scene, cam);
  return R.domElement.toDataURL('image/png');
}
window.renderPack = render;
// герб отдельно (экран загрузки, логотип): тот же щит и монограмма, золото, прозрачный фон
window.renderCrest = async () => {
  await Promise.all(['italic 900 40px JB'].map((f) => document.fonts.load(f, 'JG')));
  const t = TIERS[3], W = 800, H = 960, c = cv(W, H), g = c.getContext('2d'), cx = W / 2, cy = 120, sw = 700, sh = 800;
  for (let i = 0; i < 3; i++) { const x = cx + (i - 1) * 110; star(g, x, 70 + (i === 1 ? -14 : 0) + 4, 46, 19); g.fillStyle = 'rgba(0,0,0,.4)'; g.fill(); star(g, x, 70 + (i === 1 ? -14 : 0), 46, 19); g.fillStyle = metal(g, 20, 120, t.rim); g.fill(); g.strokeStyle = t.rim[2]; g.lineWidth = 3; g.stroke(); }
  g.save(); g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 40; g.shadowOffsetY = 18; shield(g, cx, cy + 40, sw, sh); g.fillStyle = '#000'; g.fill(); g.restore();
  shield(g, cx, cy + 40, sw, sh); g.fillStyle = metal(g, cy, cy + sh, t.rim); g.fill();
  shield(g, cx, cy + 66, sw - 64, sh - 66); const inner = g.createLinearGradient(0, cy, 0, cy + sh); inner.addColorStop(0, '#0b1a3a'); inner.addColorStop(0.5, '#1f4fb8'); inner.addColorStop(1, '#0b1a3a'); g.fillStyle = inner; g.fill();
  g.save(); shield(g, cx, cy + 66, sw - 64, sh - 66); g.clip(); g.globalAlpha = 0.2; g.fillStyle = '#c6ff3d'; g.beginPath(); g.arc(cx, cy + 40 + sh * 0.43, 220, 0, 7); g.fill();
  g.globalAlpha = 0.16; g.fillStyle = '#fff'; g.beginPath(); g.ellipse(cx - 60, cy + 150, 260, 70, -0.25, 0, 7); g.fill(); g.restore();
  g.font = 'italic 900 470px JB'; g.textAlign = 'center'; const my = cy + 40 + sh * 0.63; g.lineJoin = 'round';
  g.lineWidth = 34; g.strokeStyle = 'rgba(0,0,0,.55)'; g.strokeText('JG', cx + 6, my + 12); g.lineWidth = 22; g.strokeStyle = t.rim[2]; g.strokeText('JG', cx, my); g.fillStyle = metal(g, my - 300, my, t.rim); g.fillText('JG', cx, my);
  return c.toDataURL('image/png');
};
</script></body></html>
