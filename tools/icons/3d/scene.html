<!doctype html><html><body style="margin:0;background:transparent">

<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

  ex2.putImageData(ed,0,0);
  {const c3=document.createElement('canvas');c3.width=c3.height=W0;const x3=c3.getContext('2d');x3.drawImage(ren.domElement,0,0);x3.filter='blur(.6px)';x3.drawImage(edge,0,0);var shot=c3;}

};

</script></body></html>
