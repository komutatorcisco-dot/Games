<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0b26"/><stop offset=".55" stop-color="#191a52"/><stop offset="1" stop-color="#2a2470"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d6" stop-opacity=".32"/><stop offset="1" stop-color="#fff6d6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4594"/><stop offset="1" stop-color="#1b2160"/>
    </linearGradient>
    <linearGradient id="tierA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a72"/><stop offset="1" stop-color="#151a4c"/>
    </linearGradient>
    <linearGradient id="tierB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3384"/><stop offset="1" stop-color="#1a1f58"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </linearGradient>
    <pattern id="crowd" width="9" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2.2" cy="2.4" r="1.9" fill="#e8445a"/><circle cx="6.8" cy="2" r="1.9" fill="#f2f2f7"/>
      <circle cx="4.4" cy="6.2" r="1.9" fill="#ffcf3a"/><circle cx="8.6" cy="6.4" r="1.9" fill="#4f8bff"/>
      <circle cx="0" cy="6.4" r="1.9" fill="#4f8bff"/>
    </pattern>
    <pattern id="crowd2" width="7" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.8" r="1.4" fill="#f2f2f7"/><circle cx="5.2" cy="1.6" r="1.4" fill="#e8445a"/>
      <circle cx="3.4" cy="4.6" r="1.4" fill="#4f8bff"/><circle cx="6.8" cy="4.8" r="1.4" fill="#ffcf3a"/><circle cx="0" cy="4.8" r="1.4" fill="#ffcf3a"/>
    </pattern>
    <clipPath id="upper"><path d="M-40 250 Q200 120 440 250 L440 300 Q200 190 -40 300 Z"/></clipPath>
    <clipPath id="lower"><path d="M-40 312 Q200 204 440 312 L440 372 Q200 286 -40 372 Z"/></clipPath>
  </defs>
  <rect width="400" height="560" fill="url(#sky)"/>
  <!-- звёзды -->
  <g fill="#fff">
    <circle cx="40" cy="40" r="1" opacity=".6"/><circle cx="120" cy="22" r=".8" opacity=".5"/><circle cx="210" cy="50" r="1.1" opacity=".7"/>
    <circle cx="300" cy="28" r=".9" opacity=".5"/><circle cx="360" cy="70" r="1" opacity=".6"/><circle cx="260" cy="96" r=".8" opacity=".4"/>
    <circle cx="80" cy="104" r=".8" opacity=".4"/><circle cx="170" cy="86" r=".7" opacity=".5"/>
  </g>
  <!-- лучи прожекторов -->
  <g style="mix-blend-mode:screen">
    <path d="M44 92 L60 92 L250 470 L120 480 Z" fill="url(#beam)"><animate attributeName="opacity" values=".8;1;.8" dur="5s" repeatCount="indefinite"/></path>
    <path d="M340 92 L356 92 L280 480 L150 470 Z" fill="url(#beam)"><animate attributeName="opacity" values="1;.8;1" dur="6s" repeatCount="indefinite"/></path>
  </g>
  <!-- мачты -->
  <g>
    <rect x="49" y="96" width="5" height="190" fill="#11143a"/><rect x="346" y="96" width="5" height="190" fill="#11143a"/>
    <rect x="30" y="70" width="44" height="26" rx="4" fill="#11143a"/><rect x="326" y="70" width="44" height="26" rx="4" fill="#11143a"/>
    <g fill="#fff8dc">
      <rect x="34" y="74" width="10" height="8" rx="2"/><rect x="47" y="74" width="10" height="8" rx="2"/><rect x="60" y="74" width="10" height="8" rx="2"/>
      <rect x="34" y="85" width="10" height="8" rx="2"/><rect x="47" y="85" width="10" height="8" rx="2"/><rect x="60" y="85" width="10" height="8" rx="2"/>
      <rect x="330" y="74" width="10" height="8" rx="2"/><rect x="343" y="74" width="10" height="8" rx="2"/><rect x="356" y="74" width="10" height="8" rx="2"/>
      <rect x="330" y="85" width="10" height="8" rx="2"/><rect x="343" y="85" width="10" height="8" rx="2"/><rect x="356" y="85" width="10" height="8" rx="2"/>
    </g>
  </g>
  <!-- крыша чаши -->
  <path d="M-40 236 Q200 100 440 236 L440 256 Q200 124 -40 256 Z" fill="url(#roof)"/>
  <path d="M-40 236 Q200 100 440 236" fill="none" stroke="#5a6ad0" stroke-width="2"/>
  <g fill="#fff3c4" opacity=".9">
    <circle cx="20" cy="221" r="1.6"/><circle cx="70" cy="194" r="1.6"/><circle cx="120" cy="176" r="1.6"/><circle cx="170" cy="167" r="1.6"/>
    <circle cx="230" cy="167" r="1.6"/><circle cx="280" cy="176" r="1.6"/><circle cx="330" cy="194" r="1.6"/><circle cx="380" cy="221" r="1.6"/>
  </g>
  <!-- верхний ярус -->
  <path d="M-40 250 Q200 120 440 250 L440 300 Q200 190 -40 300 Z" fill="url(#tierA)"/>
  <g clip-path="url(#upper)" opacity=".42"><rect x="-40" y="110" width="480" height="200" fill="url(#crowd2)"/></g>
  <g clip-path="url(#upper)"><rect x="-40" y="110" width="480" height="200" fill="url(#shade)"/></g>
  <!-- козырёк между ярусами -->
  <path d="M-40 300 Q200 190 440 300 L440 312 Q200 204 -40 312 Z" fill="#0e123a"/>
  <!-- нижний ярус -->
  <path d="M-40 312 Q200 204 440 312 L440 372 Q200 286 -40 372 Z" fill="url(#tierB)"/>
  <g clip-path="url(#lower)" opacity=".55"><rect x="-40" y="200" width="480" height="180" fill="url(#crowd)"/></g>
  <g clip-path="url(#lower)"><rect x="-40" y="200" width="480" height="180" fill="url(#shade)"/></g>
  <!-- рекламный борт -->
  <path d="M-40 372 Q200 286 440 372 L440 384 Q200 300 -40 384 Z" fill="#ffcf3a"/>
  <path d="M-40 384 Q200 300 440 384 L440 392 Q200 309 -40 392 Z" fill="#b8860b"/>
  <!-- вспышки камер в толпе -->
  <g fill="#fff">
    <circle cx="96" cy="262" r="2.4" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.6;.62;.66;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="282" cy="250" r="2.4" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.3;.32;.36;1" dur="4.3s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="236" r="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.8;.82;.86;1" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="300" r="2.6" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.45;.47;.51;1" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="318" cy="318" r="2.6" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.15;.17;.21;1" dur="4.9s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="330" r="2.6" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.7;.72;.76;1" dur="6.1s" repeatCount="indefinite"/></circle>
  </g>
  <!-- газон за бортом -->
  <path d="M-40 392 Q200 309 440 392 L440 560 L-40 560 Z" fill="#1e6b34"/>
  <path d="M-40 392 Q200 309 440 392 L440 560 L-40 560 Z" fill="url(#shade)"/>
</svg>
