  <path id="adline" d="M-40 381 Q200 296 440 381" fill="none"/>
  <text font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="8.5" fill="#2a1a00" letter-spacing="2"><textPath href="#adline" startOffset="4%">СТАРИКИ ДЖЕКСОНЫ · @OLDJACKSONS · СТАРИКИ ДЖЕКСОНЫ · @OLDJACKSONS · СТАРИКИ ДЖЕКСОНЫ</textPath></text>
  <path d="M-40 384 Q200 300 440 384 L440 392 Q200 309 -40 392 Z" fill="#b8860b"/>
