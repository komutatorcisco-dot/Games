    <rect x="30" y="70" width="44" height="26" rx="4" fill="#11143a"/><rect x="326" y="70" width="44" height="26" rx="4" fill="#11143a"/>
    <g fill="#fff8dc">
      <rect x="34" y="74" width="10" height="8" rx="2"/><rect x="47" y="74" width="10" height="8" rx="2"/><rect x="60" y="74" width="10" height="8" rx="2"/>
      <rect x="34" y="85" width="10" height="8" rx="2"/><rect x="47" y="85" width="10" height="8" rx="2"/><rect x="60" y="85" width="10" height="8" rx="2"/>
      <rect x="330" y="74" width="10" height="8" rx="2"/><rect x="343" y="74" width="10" height="8" rx="2"/><rect x="356" y="74" width="10" height="8" rx="2"/>
      <rect x="330" y="85" width="10" height="8" rx="2"/><rect x="343" y="85" width="10" height="8" rx="2"/><rect x="356" y="85" width="10" height="8" rx="2"/>
    </g>
  </g>
  <!-- крыша чаши -->
