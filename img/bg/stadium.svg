  <g clip-path="url(#lower)" opacity=".7"><rect x="-40" y="200" width="480" height="180" fill="url(#crowd)"><animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0;0 .8;0 0" dur="1.6s" repeatCount="indefinite"/></rect></g>
  <g clip-path="url(#lower)"><rect x="-40" y="200" width="480" height="180" fill="url(#shade)"/></g>
