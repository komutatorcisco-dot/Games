    <circle cx="300" cy="28" r=".9" opacity=".5"/><circle cx="360" cy="70" r="1" opacity=".6"/><circle cx="260" cy="96" r=".8" opacity=".4"/>
    <circle cx="80" cy="104" r=".8" opacity=".4"/><circle cx="170" cy="86" r=".7" opacity=".5"/>
  </g>
  <!-- город вдали -->
  <path d="M-10 236 L-10 204 L14 204 L14 190 L30 190 L30 212 L46 212 L46 182 L58 182 L58 176 L70 176 L70 214 L92 214 L92 196 L108 196 L108 220 L292 220 L292 198 L306 198 L306 184 L322 184 L322 208 L338 208 L338 178 L352 178 L352 170 L364 170 L364 200 L384 200 L384 188 L410 188 L410 236 Z" fill="#14164a"/>
  <g fill="#ffd76a" opacity=".5"><rect x="18" y="196" width="2" height="2"/><rect x="24" y="200" width="2" height="2"/><rect x="50" y="188" width="2" height="2"/><rect x="62" y="182" width="2" height="2"/><rect x="62" y="194" width="2" height="2"/><rect x="96" y="202" width="2" height="2"/><rect x="310" y="190" width="2" height="2"/><rect x="342" y="184" width="2" height="2"/><rect x="356" y="178" width="2" height="2"/><rect x="356" y="190" width="2" height="2"/><rect x="390" y="196" width="2" height="2"/></g>
