  <g clip-path="url(#upper)" opacity=".5"><rect x="-40" y="110" width="480" height="200" fill="url(#crowd2)"><animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0;0 .6;0 0" dur="1.9s" repeatCount="indefinite"/></rect></g>
  <g clip-path="url(#upper)"><rect x="-40" y="110" width="480" height="200" fill="url(#shade)"/></g>
