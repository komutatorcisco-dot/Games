    <rect x="66" y="200" width="88" height="180" fill="#2f5bd8"/><rect x="154" y="200" width="6" height="180" fill="#0e123a"/>
    <rect x="160" y="200" width="80" height="180" fill="#ffcf3a"/><rect x="240" y="200" width="6" height="180" fill="#0e123a"/>
    <rect x="246" y="200" width="88" height="180" fill="#2f5bd8"/><rect x="334" y="200" width="6" height="180" fill="#0e123a"/>
    <rect x="340" y="200" width="100" height="180" fill="#ffcf3a"/>
