    <rect x="-60" y="-25" width="120" height="34" rx="4" fill="#111a4e"/>
    <text x="0" y="-9" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="12" fill="#ffcf3a" letter-spacing="1">ДЖЕКСОНЫ</text>
    <text x="0" y="5" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="9" fill="#fff" letter-spacing="1.5">АРЕНА</text>
    <rect x="-3" y="14" width="6" height="16" fill="#0b0d2a"/>
    <rect x="-60" y="-25" width="120" height="34" rx="4" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;0;.12;0" keyTimes="0;.85;.9;1" dur="7s" repeatCount="indefinite"/></rect>
  </g>
  <!-- верхний ярус -->
